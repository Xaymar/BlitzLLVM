name: Set up llvm-mingw
description: >
  Gets llvm-mingw (clang, lld and a MinGW-w64 sysroot that uses the Universal C Runtime of Windows) for the architecture of the runner
  with tools/build.cmake --tools-only, which pins its version, and puts it on the PATH. These are the same files as the ones that the
  build uses, in .tools of the checkout.

runs:
  using: composite
  steps:
    - name: Get llvm-mingw
      shell: bash
      run: |
        cmake -P tools/build.cmake -- --tools-only
        # The script added it to GITHUB_PATH for the next steps; this one checks it here.
        "$(cygpath -u "$(tail -n 1 "$GITHUB_PATH")")/clang" --version
