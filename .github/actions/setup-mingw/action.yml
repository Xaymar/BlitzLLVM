name: Set up llvm-mingw
description: >
  Installs llvm-mingw (clang, lld and a MinGW-w64 sysroot that uses the Universal C Runtime of Windows) for the architecture of the runner,
  and puts it on the PATH. Windows is built and linked for the MinGW target, which needs neither Visual Studio nor the Windows SDK.

runs:
  using: composite
  steps:
    - name: Install llvm-mingw
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
        $dir = Join-Path $env:RUNNER_TEMP 'llvm-mingw-download'
        New-Item -ItemType Directory -Force $dir | Out-Null
        gh release download --repo mstorsjo/llvm-mingw --pattern "llvm-mingw-*-ucrt-$arch.zip" --dir $dir
        Expand-Archive (Get-ChildItem $dir -Filter *.zip | Select-Object -First 1).FullName -DestinationPath (Join-Path $env:RUNNER_TEMP 'llvm-mingw')
        $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'llvm-mingw') -Directory | Select-Object -First 1).FullName + '\bin'
        $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        $env:PATH = "$bin;$env:PATH"
        clang --version
        ninja --version
