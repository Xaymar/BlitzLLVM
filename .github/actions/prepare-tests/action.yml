name: Prepare the tests
description: >
  Downloads the build tree that build.yml uploaded for a platform (test-build-<platform>), unpacks it where it was built, and
  selects the tests to run (see .github/scripts/test-select.py). The job needs the checkout and the python it passes in.

inputs:
  platform:
    description: 'The name of the platform of build.yml, for example ubuntu24.04-x64'
    required: true
  python:
    description: 'The python to run the scripts with'
    default: python3

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: test-build-${{ inputs.platform }}
        path: ${{ runner.temp }}/test-build
    - name: Unpack the build
      shell: bash
      # In the same place as it was built (the workspace of the runner is the same on every job of a platform), because the tests
      # are registered with absolute paths.
      run: gzip -dc "$RUNNER_TEMP/test-build/test-build.tgz" | tar -xf -
    - name: Select the tests
      shell: bash
      working-directory: build/code_compiler
      env:
        PY: ${{ inputs.python }}
      # The tests are known now. A partial selection writes the names of the tests to run, and the ones to skip with the reason. If
      # the selection fails for any reason, everything runs.
      run: |
        ctest -C Release --show-only=json-v1 > "$RUNNER_TEMP/tests.json"
        if ! $PY "$GITHUB_WORKSPACE/.github/scripts/test-select.py" apply --selection "$SELECTION" --tests "$RUNNER_TEMP/tests.json" --selected "$RUNNER_TEMP/selected.txt" --skipped "$RUNNER_TEMP/skipped.json"; then
          echo "::warning::The test selection failed, so every test runs."
          rm -f "$RUNNER_TEMP/selected.txt" "$RUNNER_TEMP/skipped.json"
          echo "MODE=all" >> "$GITHUB_ENV"
        fi
    - name: Create tests/checker.png
      shell: bash
      # Some of the suite loads this 64 by 64 picture. It is not in the repository (tests/.gitignore ignores pictures).
      env:
        PY: ${{ inputs.python }}
      run: |
        $PY - <<'PYTHON'
        import struct, zlib
        size = 64
        rows = b"".join(b"\x00" + b"".join((b"\xff\xff\xff" if ((x // 8) + (y // 8)) % 2 else b"\x20\x20\x20") for x in range(size)) for y in range(size))
        def chunk(kind, data):
            body = kind + data
            return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))
        png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b"")
        open("tests/checker.png", "wb").write(png)
        PYTHON
