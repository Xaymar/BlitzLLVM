name: Install apt packages
description: >
  Installs packages with apt-get, and keeps the downloaded .deb files in a cache (actions/cache) so that they are not downloaded on every run.
  The key is made from the package list, the architecture, the runner image and the month, so a changed list or a new month downloads again.
  Only GitHub's own actions are used.

inputs:
  packages:
    description: The packages to install, separated by spaces.
    required: true
  cache:
    description: Whether to cache the downloaded packages ('false' for a clean install).
    default: 'true'

runs:
  using: composite
  steps:
    - name: Date the package cache
      id: month
      shell: bash
      # Ubuntu publishes updates to these packages, so the cache is replaced every month and never serves old ones for long.
      run: |
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
        echo "list=$(printf '%s' '${{ inputs.packages }}' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Restore the downloaded packages
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/apt-archives
        key: apt-${{ runner.arch }}-${{ runner.environment }}-${{ steps.month.outputs.month }}-${{ steps.month.outputs.list }}
    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # apt-get keeps (and re-uses) the .deb files in the archives folder, which is the one that is cached. It still updates its package index (small).
        ARCHIVES="$HOME/apt-archives"
        sudo mkdir -p "$ARCHIVES/partial"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -o "Dir::Cache::archives=$ARCHIVES" $PACKAGES
        # actions/cache saves as the runner user, which has to be able to read the files.
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
        sudo rm -rf "$ARCHIVES/partial" "$ARCHIVES/lock"
