name: Release

# Publishes a release for a version tag (1.2.3, 1.2.3-rc1) with the binaries that the Nightly workflow built for the tagged
# commit. The moving tags (nightly, daily, weekly, monthly, yearly) do not match these patterns. See docs/wiki/Releasing.md.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# contents: write creates the release, actions: read finds and downloads the artifacts of the Nightly run.
permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    # The script waits for a Nightly run that is still building, which takes a while.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes list the commits since the previous release tag.
          fetch-depth: 0
          fetch-tags: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --timeout 120
