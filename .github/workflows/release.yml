name: Release

# Builds a version tag (2026.11.5.19421, 2026.11.5.19421-rc1) from scratch and publishes a GitHub release with the resulting binaries. Nothing is
# restored from or saved to a cache, so the binaries are clean. The moving tags (nightly, daily, weekly, monthly, yearly) do not
# match these patterns. A release can also be made, or its binaries replaced, by hand for a tag that exists already.
# See docs/wiki/Releasing.md.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, such as 2026.11.5.19421 or 2026.11.5.19421-rc1'
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The same patterns as the push trigger: a manual run must not release nightly, daily, a branch name and so on.
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$TAG' is not a release tag. Release tags look like 2026.11.5.19421 or 2026.11.5.19421-rc1."
            exit 1
          fi
          if [ -z "$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}")" ]; then
            echo "::error::The tag '$TAG' does not exist. Push it first; this workflow never creates tags."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check that the tag is the version of its commit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The compiler of the tagged commit reports the version in cmake/project_version.cmake, and the tag has to name it.
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout -q "refs/tags/${TAG}"
          git submodule update -q --init --depth 1 cmake/version
          EXPECTED="$(cmake -P cmake/project_version.cmake)"
          ACTUAL="${TAG%%-*}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The tag '$TAG' is not the version of its commit. The compiler built from it reports $EXPECTED, so the tag has to be $EXPECTED (or $EXPECTED-rc1 for a pre-release). Print it with: .github/scripts/release_version.py <commit>"
            exit 1
          fi

  build:
    name: Build
    needs: tag
    # The platforms, packages and their checks are in build.yml, which the Nightly and Test workflows use as well.
    uses: ./.github/workflows/build.yml
    with:
      clean: true
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write creates the release and uploads the assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          # The release notes list the commits since the previous release tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect the files
        run: |
          mkdir release
          for d in artifacts/*; do
            case "$d" in
              # Packages are already named after their version and platform.
              *-packages) mv "$d"/* release/ ;;
              *) (cd "$d" && zip -qr "../../release/$(basename "$d").zip" .) ;;
            esac
          done
          ls -l release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: python3 .github/scripts/release.py "$TAG" --repo "$GITHUB_REPOSITORY" --files release
