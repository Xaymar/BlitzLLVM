name: Benchmark build

# Builds the compiler of a baseline commit (the way that commit builds Windows) and the compiler of this ref (this workflow's way), and compiles the benchmark
# programs of benchmarks/ with each of them, so that they can run on a computer that has no compiler: the artifacts bench-baseline and bench-candidate hold
# folders of finished .exe files and run_prebuilt.ps1, which runs them (extract both into one folder and run the script, see benchmarks/README.adoc).
# It runs when benchmarks/bench-build.json is pushed (its "baseline" is the commit to compare with), or by hand with the baseline as input.
on:
  push:
    paths:
      - benchmarks/bench-build.json
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Commit to compare with. Empty: the one in benchmarks/bench-build.json'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ steps.baseline.outputs.baseline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: baseline
        env:
          INPUT: ${{ inputs.baseline }}
        run: echo "baseline=${INPUT:-$(jq -r .baseline benchmarks/bench-build.json)}" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            mingw: false
            msystem: UCRT64
            msys: make nasm diffutils mingw-w64-ucrt-x86_64-gcc
          - label: candidate
            mingw: true
            msystem: CLANG64
            msys: make nasm diffutils mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-libwinpthread
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.label == 'baseline' && needs.plan.outputs.baseline || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The benchmark programs and scripts are the ones of this ref for both builds, so that both compile the same programs.
          path: bench-src
          sparse-checkout: |
            benchmarks
            .github/actions
      - name: Check out the submodules
        shell: bash
        run: git submodule update --init --depth 1 --jobs 8 cmake/version cmake/externalcontent third_party/Vulkan-Headers third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/stb third_party/cgltf third_party/JoltPhysics third_party/VulkanMemoryAllocator third_party/FFmpeg third_party/blitz3d third_party/blitzplus_msvc2017
      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install CMake
        shell: bash
        run: |
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NASM
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      - name: Install MSYS2 for FFmpeg
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys }}
      - name: Tell the build where MSYS2 is
        shell: bash
        run: echo "BLITZLLVM_MSYS2=${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"
      - name: Set up llvm-mingw
        if: matrix.mingw
        uses: ./bench-src/.github/actions/setup-mingw
      - name: Configure (baseline)
        if: ${{ !matrix.mingw }}
        shell: bash
        run: |
          VERSION="$(cmake -P cmake/project_version.cmake)"
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON
      - name: Configure (candidate)
        if: matrix.mingw
        shell: bash
        run: |
          VERSION="$(cmake -P cmake/project_version.cmake)"
          TRIPLE=x86_64-w64-mingw32
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$TRIPLE-clang -DCMAKE_CXX_COMPILER=$TRIPLE-clang++ -DCMAKE_LINKER_TYPE=LLD -DCMAKE_RC_COMPILER=$TRIPLE-windres -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON
      - name: Build
        shell: bash
        run: cmake --build build --config Release
      - name: Install
        shell: bash
        run: cmake --install build --config Release --prefix dist
      - name: Set up the Visual Studio environment (baseline)
        if: ${{ !matrix.mingw }}
        shell: pwsh
        # The compiler of the baseline links for the MSVC target and needs the libraries of Visual Studio and the Windows SDK.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }
      - name: List the sysroot (diagnostic)
        if: matrix.mingw
        shell: pwsh
        run: |
          Get-ChildItem dist/lib/blitzllvm/mingw/x86_64 | Format-Table Name, Attributes
          $root = (Get-ChildItem "$env:RUNNER_TEMP/llvm-mingw" -Directory | Select-Object -First 1).FullName
          Get-ChildItem $root | Format-Table Name, Attributes
          Get-ChildItem "$root/x86_64-w64-mingw32" | Format-Table Name, Attributes
          Get-ChildItem "$root/generic-w64-mingw32" -ErrorAction SilentlyContinue | Format-Table Name, Attributes
      - name: Time emitted with the packaged compiler (diagnostic)
        shell: pwsh
        # int_loop_ms and select_ms of emitted were slower in the candidate on Shibela. The inline C code of the runtime did not compile there, because the
        # package had no C headers, so this prints the output of the compiler and the times.
        run: |
          clang --version
          $blitzcc = (Resolve-Path dist/bin/blitzcc.exe).Path
          $work = Join-Path $env:RUNNER_TEMP "emittedcmp"
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item bench-src/benchmarks/emitted.bb $work
          Push-Location $work
          & $blitzcc -o (Join-Path $work "emitted.exe") (Join-Path $work "emitted.bb") 2>&1 | Tee-Object -Variable output
          Pop-Location
          if ($output -match "error") { Write-Host "the compiler printed errors" }
          foreach ($run in 1..5) {
            $env:BENCH_RESULT = Join-Path $work "r.txt"
            Remove-Item $env:BENCH_RESULT -ErrorAction SilentlyContinue
            Start-Process -FilePath (Join-Path $work "emitted.exe") -WorkingDirectory $work -Wait | Out-Null
            $line = Get-Content $env:BENCH_RESULT | Where-Object { $_ -match "RESULT " } | Select-Object -First 1
            "run ${run}: " + (([regex]::Matches($line, "(int_loop|select|strings|float_loop)_ms=\d+") | ForEach-Object { $_.Value }) -join " ")
          }
      - name: Compare the code of clang 20 and clang 23 for emitted (diagnostic)
        if: matrix.mingw
        shell: pwsh
        # The same LLVM IR of emitted.bb, compiled to assembly by the clang of the runner (20, MSVC target) and by the clang of llvm-mingw (23), both for the
        # MinGW target, to see which loops they treat differently.
        run: |
          $blitzcc = (Resolve-Path dist/bin/blitzcc.exe).Path
          $work = Join-Path $env:RUNNER_TEMP "asmcmp"
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item bench-src/benchmarks/emitted.bb $work
          Push-Location $work
          & $blitzcc -q -S -o (Join-Path $work "emitted.ll") (Join-Path $work "emitted.bb")
          Pop-Location
          $flags = "-O3", "-funroll-loops", "-ffp-contract=off", "--target=x86_64-w64-mingw32", "-w", "-S"
          $remarks = "-Rpass=loop-vectorize", "-Rpass=loop-unroll", "-Rpass-missed=loop-vectorize", "-Rpass=slp-vectorizer"
          foreach ($entry in @(@("clang20", "C:\Program Files\LLVM\bin\clang.exe"), @("clang23", "clang"))) {
            $out = Join-Path $work ($entry[0] + ".s")
            & $entry[1] @flags @remarks (Join-Path $work "emitted.ll") -o $out 2>&1 | Out-File (Join-Path $work ($entry[0] + ".remarks.txt"))
            $asm = Get-Content $out
            "{0}: {1} lines of assembly, idiv {2}, imul {3}, vector instructions {4}, remarks {5}" -f $entry[0], $asm.Count, ($asm | Select-String -Pattern "\bidiv" ).Count, ($asm | Select-String -Pattern "\bimul").Count, ($asm | Select-String -Pattern "\b(vp|p)(add|mul|sub|xor|srl|sll)").Count, (Get-Content (Join-Path $work ($entry[0] + ".remarks.txt"))).Count
          }
          foreach ($entry in "clang20", "clang23") {
            "== remarks of $entry"
            Get-Content (Join-Path $work ($entry + ".remarks.txt")) | Where-Object { $_ -match "remark" } | ForEach-Object { ($_ -replace "^.*?remark: ", "") } | Group-Object | Sort-Object Count -Descending | Select-Object -First 12 | ForEach-Object { "{0} x {1}" -f $_.Count, $_.Name }
          }
          "== clang20 main loops"
          Select-String -Path (Join-Path $work "clang20.s") -Pattern "imul|idiv|\bdiv" | Select-Object -First 25 | ForEach-Object { $_.Line }
          "== clang23 main loops"
          Select-String -Path (Join-Path $work "clang23.s") -Pattern "imul|idiv|\bdiv" | Select-Object -First 25 | ForEach-Object { $_.Line }
          foreach ($entry in "clang20", "clang23") {
            "== full assembly of $entry"
            Get-Content (Join-Path $work ($entry + ".s")) | Where-Object { $_ -notmatch "^\s*\.(cfi|seh|p2align|file|def|scl|type|endef)" }
            "== end of $entry"
          }
      - name: Build the benchmark programs
        shell: pwsh
        run: |
          $out = "bench-out/${{ matrix.label }}"
          & bench-src/benchmarks/build_prebuilt.ps1 -Blitzcc (Resolve-Path dist/bin/blitzcc.exe) -Out $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item bench-src/benchmarks/run_prebuilt.ps1 bench-out/
          Get-ChildItem bench-out -Recurse | Select-Object FullName, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-${{ matrix.label }}
          path: bench-out
