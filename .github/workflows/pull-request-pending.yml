name: Pull Request Pending

# Posts a "Build pending" comment the moment a pull request is opened, and resets it whenever new commits are pushed.
# pull-request-comment.yml replaces it with the result once the 'Pull Request' workflow finished. A single comment, marked
# with a hidden marker, is kept per pull request.
#
# This uses pull_request_target so that pull requests from forks get a token that can write comments. That is only safe
# because this workflow never checks out, builds or executes anything from the pull request: it has no checkout step, and
# the only values it uses are the pull request number and head commit, which are numeric / hex and are passed through
# environment variables, never interpolated into the script. Do not add a checkout of the pull request here.
# pull_request_target runs the workflow file from the base branch, so this starts working once it was merged.

on:
  pull_request_target:
    branches: [root]
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

# Serialized per pull request, so two pushes in quick succession can not interleave their comment updates.
concurrency:
  group: pull-request-pending-${{ github.event.pull_request.number }}

jobs:
  pending:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reset the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER='<!-- blitzllvm-pr-build -->'

          # Only describe the commit that is still the head of the pull request.
          CURRENT="$(gh api "repos/${GH_REPO}/pulls/${NUMBER}" --jq .head.sha)"
          if [ "$CURRENT" != "$EVENT_SHA" ]; then
            echo "The pull request moved on to ${CURRENT}, skipping."
            exit 0
          fi

          ID="$(gh api --paginate "repos/${GH_REPO}/issues/${NUMBER}/comments" \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"${MARKER}\")))][0] | select(. != null) | .id" | head -n1)"

          # The build of this very commit may already have reported (a fast build, or a delayed run of this job). The result wins.
          if [ -n "$ID" ]; then
            BODY="$(gh api "repos/${GH_REPO}/issues/comments/${ID}" --jq .body)"
            case "$BODY" in
              *"Commit \`${EVENT_SHA::7}\`"*) 
                case "$BODY" in
                  *'Build pending'*) ;;
                  *) echo "Commit ${EVENT_SHA::7} already has a result, skipping."; exit 0 ;;
                esac ;;
            esac
          fi

          {
            echo "$MARKER"
            echo "## ⏳ Build pending"
            echo
            echo "Commit \`${EVENT_SHA::7}\` · The binaries will be listed here once the build finished."
          } > comment.md

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${ID}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${NUMBER}/comments" -F body=@comment.md > /dev/null
          fi
