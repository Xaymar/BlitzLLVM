name: Build

# The build and packaging of all platforms, for the Nightly workflow (which publishes the result), the Release workflow (with 'clean') and the Test workflow (which builds pull requests and tests them). The caller decides what to do with the
# artifacts, which are named blitzllvm-<version>-<platform> and, for the Linux and macOS packages, blitzllvm-<version>-<platform>-packages.
# A call builds every platform of the matrix below, except without 'packages': then only the ones with a "test" entry (Linux, Windows and
# macOS) are built, as the others would only be built to be packaged. With 'tests' those also upload their build tree for the Test workflow.
on:
  workflow_call:
    inputs:
      clean:
        description: 'Build without restoring or saving any cache, from a fresh checkout'
        type: boolean
        default: false
      ref:
        description: 'Check out this ref (tag, branch or commit) instead of the one that started the workflow. Empty: the default'
        type: string
        default: ''
      loose:
        description: 'Upload every package and archive as a file of its own that is not zipped again, instead of one artifact per platform that holds a directory'
        type: boolean
        default: false
      packages:
        description: 'Package the build (archives, the Flatpaks, the Windows installer, macOS package) and upload them. Without it only the build is made'
        type: boolean
        default: true
      all-tests:
        description: 'Without packages: build all the test platforms. Off builds Linux alone (a change that only some of the tests depend on is tested on Linux alone)'
        type: boolean
        default: true
      tests:
        description: 'Also configure the tests that need a window and a GPU, and upload the build tree for the Test workflow as test-build-<platform>'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      # One platform failing fails the whole run: the other platforms are cancelled instead of building to the end.
      fail-fast: true
      # The repository has 20 runners in total (5 of them macOS), shared by every run. Only this many platforms of a run build at the same
      # time, so that other pull requests can run too. The platforms that run the tests are first in the list, so they start first.
      max-parallel: 3
      matrix:
        # Linux is released as a Flatpak only (packaging/flatpak), built on Ubuntu 24.04 with every library bundled, as the freedesktop runtime has none
        # of the ones that a distribution has. "test" is the name of the platform in the test comment, and marks the ones that are
        # built without packages, and tested by the Test workflow (the Linux tests run the very build that is packaged).
        # This is the list of all of them; the entries with "test" are repeated in the shorter lists for builds without packages (all test
        # platforms, or Linux alone with 'all-tests' off),
        # because a matrix can only be cut down by an expression on the inputs (an 'exclude' does not apply to entries of 'include').
        include: ${{ fromJSON(inputs.packages && '[{"name":"windows-x64","os":"windows-latest","platform":"x64","msystem":"CLANG64","msys":"make nasm diffutils mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-libwinpthread","test":"Windows"},{"name":"linux-x64","os":"ubuntu-24.04","kind":"flatpak","configure":"-DBLITZ_SYSTEM_SDL3=OFF -DBLITZ_SYSTEM_SDL3_IMAGE=OFF -DBLITZ_SYSTEM_SDL3_MIXER=OFF -DBLITZ_SYSTEM_IMAGE_CODECS=OFF -DBLITZ_SYSTEM_AUDIO_CODECS=OFF -DBLITZ_SYSTEM_FFMPEG=OFF","test":"Linux"},{"name":"macos-universal","os":"macos-latest","architectures":"arm64;x86_64","test":"macOS"},{"name":"windows-arm64","os":"windows-11-arm","platform":"ARM64","msystem":"CLANGARM64","msys":"make diffutils mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-libwinpthread"},{"name":"linux-arm64","os":"ubuntu-24.04-arm","kind":"flatpak","configure":"-DBLITZ_SYSTEM_SDL3=OFF -DBLITZ_SYSTEM_SDL3_IMAGE=OFF -DBLITZ_SYSTEM_SDL3_MIXER=OFF -DBLITZ_SYSTEM_IMAGE_CODECS=OFF -DBLITZ_SYSTEM_AUDIO_CODECS=OFF -DBLITZ_SYSTEM_FFMPEG=OFF"}]' || (inputs.all-tests && '[{"name":"windows-x64","os":"windows-latest","platform":"x64","msystem":"CLANG64","msys":"make nasm diffutils mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-libwinpthread","test":"Windows"},{"name":"linux-x64","os":"ubuntu-24.04","kind":"flatpak","configure":"-DBLITZ_SYSTEM_SDL3=OFF -DBLITZ_SYSTEM_SDL3_IMAGE=OFF -DBLITZ_SYSTEM_SDL3_MIXER=OFF -DBLITZ_SYSTEM_IMAGE_CODECS=OFF -DBLITZ_SYSTEM_AUDIO_CODECS=OFF -DBLITZ_SYSTEM_FFMPEG=OFF","test":"Linux"},{"name":"macos-universal","os":"macos-latest","architectures":"arm64;x86_64","test":"macOS"}]' || '[{"name":"linux-x64","os":"ubuntu-24.04","kind":"flatpak","configure":"-DBLITZ_SYSTEM_SDL3=OFF -DBLITZ_SYSTEM_SDL3_IMAGE=OFF -DBLITZ_SYSTEM_SDL3_MIXER=OFF -DBLITZ_SYSTEM_IMAGE_CODECS=OFF -DBLITZ_SYSTEM_AUDIO_CODECS=OFF -DBLITZ_SYSTEM_FFMPEG=OFF","test":"Linux"}]')) }}
    runs-on: ${{ matrix.os }}
    steps:
      # Containers have no git yet when checkout runs, so it is installed first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check out the submodules
        # All of the top-level ones, shallow, whatever the checked out commit has: a release can be built from an old tag, which has fewer submodules than the current root, so none are listed by name.
        run: git submodule update --init --depth 1 --jobs 8
      - name: Hash the dependency submodules
        id: dependencies
        shell: bash
        # The recorded commits of third_party/, so that updating a submodule changes the cache key.
        run: echo "hash=$(git ls-tree HEAD third_party/ | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Pin Python (Windows)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        # CMake records the path of the Python it was configured with, and the tests run on this runner right after the build, so the
        # version is fixed to keep every run the same (a newer image brought Python 3.15.2 once, which the tests did not work with).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install CMake
        # From PyPI, which is a few seconds on every runner. The project needs a newer CMake than the runners ship, and this
        # is a fixed version, so the release binaries are not built with a CMake that nobody looked at; raise it by hand.
        shell: bash
        run: |
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cmake --version
      - name: Determine the version
        # From the commit date (see cmake/project_version.cmake), so every platform of a run gets the same version without a job of
        # its own in front of the builds. The names of the packages and artifacts also carry the short commit, so a file can be
        # traced back to its source: <version>-<commit>. That is not '+<commit>' (semver build metadata) because GitHub rewrites
        # '+' in the names of release assets, which would make the files of a release differ from the ones that were built. The
        # version inside of the binaries and packages stays numeric (A.B.C.D), as VERSIONINFO requires.
        shell: bash
        run: |
          VERSION="$(cmake -P cmake/project_version.cmake)"
          FULL_VERSION="${VERSION}-${GITHUB_SHA::7}"
          echo "Version: $VERSION, in names: $FULL_VERSION"
          {
            echo "VERSION=$VERSION"
            echo "ARTIFACT=blitzllvm-${FULL_VERSION}-${{ matrix.name }}"
          } >> "$GITHUB_ENV"
      - name: Date the package cache
        id: month
        if: (matrix.kind == 'flatpak' || runner.os == 'Windows') && !inputs.clean
        # Ubuntu and MSYS2 publish updates to these packages, so the caches are replaced every month and never serve old ones for long.
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Install Linux dependencies for SDL (clean)
        if: matrix.kind == 'flatpak' && inputs.clean
        # No package cache: apt installs the current packages.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev  zstd
      - name: Install Linux dependencies for SDL
        if: matrix.kind == 'flatpak' && !inputs.clean
        uses: awalsh128/cache-apt-pkgs-action@5902b33ae29014e6ca012c5d8025d4346556bd40 # v1.4.3
        with:
          # The packages and the files they installed are restored from the cache, so apt does not update, download and unpack
          # them on every run. The key is made from the list and the month.
          packages: ninja-build nasm pkg-config libavif-dev libjxl-dev libtiff-dev libwebp-dev libopusfile-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev  zstd
          version: 1-${{ runner.arch }}-${{ steps.month.outputs.month }}
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm
      # dav1d (AVIF) has assembly for x86, which NASM builds.
      - name: Install Windows dependencies
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      # FFmpeg (movies) has a configure script, so on Windows it is built in MSYS2 (see code_runtime/dependencies.cmake).
      # The whole installation is cached, as setup-msys2 itself only caches the downloaded packages and still fetches the base installation from
      # GitHub every run (which fails now and then with HTTP 504). The key is made from the platform, the package list and the month, so
      # a changed package list installs from scratch, and an updated MSYS2 is picked up at the latest a month later. Runs with 'clean' skip the cache.
      - name: Cache MSYS2 for FFmpeg
        id: msys2-cache
        if: runner.os == 'Windows' && !inputs.clean
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\msys64
          key: msys2-${{ matrix.name }}-${{ matrix.msystem }}-${{ matrix.msys }}-${{ steps.month.outputs.month }}
      - name: Install MSYS2 for FFmpeg
        if: runner.os == 'Windows' && steps.msys2-cache.outputs.cache-hit != 'true'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys }}
      - name: Tell the build where MSYS2 is
        if: runner.os == 'Windows'
        shell: bash
        # Restored from the cache, or where setup-msys2 installed it (the same folder, runner.temp/msys64).
        run: echo "BLITZLLVM_MSYS2=${{ steps.msys2.outputs.msys2-location || format('{0}\\msys64', runner.temp) }}" >> "$GITHUB_ENV"
      # SDL3, SDL3_image (with its AVIF, JPEG XL and WebP codecs), SDL3_mixer and the Vulkan headers come from the submodules in third_party/ and are built by ExternalContent (see code_runtime/dependencies.cmake),
      # which skips every stage whose inputs are unchanged. Restoring its directory therefore skips their compilation entirely. Their
      # build options are defined in that file, so it is part of the key, and so are the ExternalContent module and the commits of the dependency submodules.
      # Pull requests restore the caches that nightly builds of root save, and only save one of their own when none exists yet.
      # The prefix is not shared with the caches from before the dependencies were submodules, as those were built from another source directory.
      - name: Cache dependencies
        if: ${{ !inputs.clean }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ExternalContentFiles
          key: submodule-dependencies-mingw-${{ matrix.name }}-${{ hashFiles('code_runtime/dependencies.cmake', 'cmake/externalcontent/ExternalContent.cmake') }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            submodule-dependencies-mingw-${{ matrix.name }}-
      # Windows is built with clang (Ninja, lld) for the MinGW target (llvm-mingw), so that building and linking programs needs neither Visual Studio
      # nor the Windows SDK. The C runtime is the Universal C Runtime that comes with Windows.
      - name: Set up llvm-mingw
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-mingw
      - name: Configure
        shell: bash
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
          # Registers the tests that need a window and a GPU, which the test steps below run (it does not change what is built).
          GPU_TESTS: ${{ inputs.tests && matrix.test && '-DBLITZ_TEST_GPU=ON' || '' }}
          # Options of one platform (Linux bundles every library).
          EXTRA_CONFIGURE: ${{ matrix.configure }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            TRIPLE=x86_64-w64-mingw32; [ "${{ matrix.platform }}" != ARM64 ] || TRIPLE=aarch64-w64-mingw32
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$TRIPLE-clang -DCMAKE_CXX_COMPILER=$TRIPLE-clang++ -DCMAKE_LINKER_TYPE=LLD -DCMAKE_RC_COMPILER=$TRIPLE-windres -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON -DBLITZLLVM_REQUIRE_HELP=ON $GPU_TESTS
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${ARCHITECTURES:+-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES"} -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON -DBLITZLLVM_REQUIRE_HELP=ON $GPU_TESTS $EXTRA_CONFIGURE
          fi
      - name: Build
        run: cmake --build build --config Release
      - name: Check that the runtime has no fused multiply-adds (arm64)
        # The default fast-math mode "precise" gives the same floats on every CPU, which a fused multiply-add (one rounding instead of two)
        # would break. Nobody can test Windows on ARM64 by hand, so the disassembly of the runtime is checked here.
        if: contains(matrix.name, 'arm64') || matrix.name == 'macos-universal'
        shell: bash
        env:
          ARCH: ${{ matrix.name == 'macos-universal' && 'arm64' || '' }}
        run: |
          libraries=$(find build \( -name 'blitzrt.a' -o -name 'libblitzrt.a' -o -name 'blitzrt.lib' \) -type f)
          test -n "$libraries" || { echo "no blitzrt library found"; exit 1; }
          python=$(command -v python3 || command -v python)
          "$python" tools/check_no_fma.py --require ${ARCH:+--arch "$ARCH"} $libraries
      - name: Keep the build for the tests
        # The Test workflow runs ctest on this tree instead of building again. Without the objects and the dependencies' sources (the runtime
        # and everything the tests run are in the tree), as a tar file because artifacts lose the permissions of the files.
        if: inputs.tests && matrix.test
        shell: bash
        run: |
          # Through a pipe: GNU tar reads "D:\a\..." as a file on a computer called D.
          tar -cf - --exclude='*.o' --exclude='*.obj' --exclude='*.pdb' --exclude='*.ilk' --exclude='*.pch' --exclude='.ninja_*' --exclude='build/ExternalContentFiles' build | gzip -1 > "$RUNNER_TEMP/test-build.tgz"
          ls -l "$RUNNER_TEMP/test-build.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.tests && matrix.test
        with:
          name: test-build-${{ matrix.name }}
          path: ${{ runner.temp }}/test-build.tgz
          # Only for the Test workflow of this run.
          retention-days: 1
          compression-level: 0
      - name: Package
        # Linux ships only the Flatpaks (see below), no archive.
        if: runner.os != 'Linux' && inputs.packages
        shell: bash
        env:
          LOOSE: ${{ inputs.loose }}
        run: |
          cmake --install build --config Release --prefix dist
          cp LICENSE.adoc README.adoc dist/
          # The libraries must not need the newer STL helpers (__std_rotate, ...), or programs fail to link with an older Visual Studio.
          [ "$RUNNER_OS" != Windows ] || .github/scripts/check-std-helpers.sh dist
          # The package compiles and runs a program by itself, with the MinGW headers and libraries it ships.
          if [ "$RUNNER_OS" = Windows ]; then
            # Programs and libraries carry libc++ and libunwind themselves. The runner has them next to its clang, so a missing DLL would
            # not show when the program below runs, but it keeps the tools from starting on a computer that only has an LLVM install.
            missing=0
            while IFS= read -r -d '' file; do
              if llvm-objdump -p "$file" | grep -qiE "DLL Name: (libc\+\+|libunwind)\.dll"; then
                echo "$file imports libc++.dll or libunwind.dll, which the package does not ship"
                missing=1
              fi
            done < <(find dist -type f \( -name '*.exe' -o -name '*.dll' \) -print0)
            [ "$missing" = 0 ]
            printf 'Print "packaged ok"\n' > "$RUNNER_TEMP/packaged.bb"
            # The inline C code of the runtime is compiled in the same step. When the headers are missing it fails and the program is slower, but it still builds.
            dist/bin/blitzcc "$RUNNER_TEMP/packaged.bb" -o "$RUNNER_TEMP/packaged.exe" 2>&1 | tee "$RUNNER_TEMP/packaged.log"
            ! grep -qi "error" "$RUNNER_TEMP/packaged.log"
            "$RUNNER_TEMP/packaged.exe" | grep -q "packaged ok"
            # And with the clang that comes with the runner's LLVM install, which does not default to compiler-rt and libc++ for the MinGW target
            # the way llvm-mingw's does (it asked for libgcc and libgcc_eh, which the package does not ship).
            dist/bin/blitzcc --cc "C:/Program Files/LLVM/bin/clang.exe" "$RUNNER_TEMP/packaged.bb" -o "$RUNNER_TEMP/packaged_plain.exe" 2>&1 | tee "$RUNNER_TEMP/packaged_plain.log"
            ! grep -qi "error" "$RUNNER_TEMP/packaged_plain.log"
            "$RUNNER_TEMP/packaged_plain.exe" | grep -q "packaged ok"
          fi
          find dist -type f -exec ls -l {} + | sort -k5 -n -r
          if [ "$LOOSE" = true ]; then
            # Zipped here, so the artifact is the .zip file itself and its name carries the extension.
            (cd dist && cmake -E tar cf "../${ARTIFACT}.zip" --format=zip .)
            NAME="${ARTIFACT}.zip"
            list() { cmake -E tar tf "$NAME"; }
          else
            NAME="$ARTIFACT"
            list() { (cd dist && find . -type f); }
          fi
          list | .github/scripts/check-licenses.sh "$NAME" build/required-licenses.txt
          list | .github/scripts/check-help.sh "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os != 'Linux' && inputs.packages && !inputs.loose
        with:
          name: ${{ env.ARTIFACT }}
          path: dist
      # With 'loose' every file is uploaded on its own with 'archive: false', so it is a separate entry that is not zipped. The
      # artifact is named after the file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os != 'Linux' && inputs.packages && inputs.loose
        with:
          path: ${{ env.ARTIFACT }}.zip
          archive: false
      - name: Build the installer (Windows)
        # Inno Setup (free, also for programs that are not) builds one setup.exe from the same directory as the zip, see installer/blitzllvm.iss.
        if: runner.os == 'Windows' && inputs.packages
        shell: pwsh
        run: |
          # The runner images ship Inno Setup; it is installed only when an image does not.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed' } }
          $arch = if ('${{ matrix.platform }}' -eq 'ARM64') { 'arm64' } else { 'x64' }
          New-Item -ItemType Directory -Force packages | Out-Null
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DArch=$arch" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\packages" "/DOutputName=$env:ARTIFACT-setup" installer\blitzllvm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem packages | Format-Table Name, Length
      - name: Test the installer (Windows)
        # Installs silently (per user, which installs nothing but BlitzLLVM), checks the files and PATH, uninstalls and checks that all of it is gone again.
        if: runner.os == 'Windows' && inputs.packages && matrix.platform != 'ARM64'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blitzllvm-installed'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $setup = (Get-Item "packages\$env:ARTIFACT-setup.exe").FullName
          $machinePath = { [Environment]::GetEnvironmentVariable('Path', 'User') }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", '/TASKS=addtopath', "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "Setup failed ($($p.ExitCode))" }
          foreach ($f in 'bin\blitzcc.exe', 'bin\blitz-format.exe', 'bin\blitz-tidy.exe', 'LICENSE.adoc', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Not installed: $f" }
          }
          if (-not ((& $machinePath) -split ';' -contains "$dir\bin")) { throw 'PATH was not changed' }
          $p = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed ($($p.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'bin')) { throw 'The uninstaller left bin behind' }
          if ((& $machinePath) -split ';' -contains "$dir\bin") { throw 'The uninstaller left PATH changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows' && inputs.packages && !inputs.loose
        with:
          name: ${{ env.ARTIFACT }}-packages
          path: packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Windows' && inputs.packages && inputs.loose
        with:
          path: packages/${{ env.ARTIFACT }}-setup.exe
          archive: false
      - name: Stage the install for the Flatpaks (Linux)
        if: inputs.packages && matrix.kind == 'flatpak'
        run: |
          # The Flatpaks are made by the flatpak job below from the installs of both architectures, so that each of them can make programs for both.
          mkdir flatpak-stage-root
          DESTDIR="$PWD/flatpak-stage-root/stage" cmake --install build --config Release --component system --prefix /app
          cp build/required-licenses.txt flatpak-stage-root/
          printf 'VERSION=%s\nARTIFACT_SUFFIX=%s\n' "$VERSION" "${ARTIFACT#blitzllvm-}" > flatpak-stage-root/version.env
          tar -C flatpak-stage-root -cf flatpak-stage.tar .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.packages && matrix.kind == 'flatpak'
        with:
          name: flatpak-stage-${{ matrix.name }}
          path: flatpak-stage.tar
          retention-days: 1
      - name: Build packages (macOS)
        if: inputs.packages && runner.os == 'macOS'
        run: |
          mkdir packages
          (cd build && cpack -G productbuild -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          rm -rf packages/_CPack_Packages
          mv packages/*.pkg "packages/${ARTIFACT}.pkg"
          pkgutil --payload-files "packages/${ARTIFACT}.pkg" | .github/scripts/check-licenses.sh "${ARTIFACT}.pkg" build/required-licenses.txt
          pkgutil --payload-files "packages/${ARTIFACT}.pkg" | .github/scripts/check-help.sh "${ARTIFACT}.pkg"
          ls -l packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'macOS' && inputs.packages && !inputs.loose
        with:
          name: ${{ env.ARTIFACT }}-packages
          path: packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.packages && inputs.loose && runner.os == 'macOS'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg
          archive: false


  flatpak:
    name: package (flatpak ${{ matrix.arch }})
    # One compiler Flatpak and one runtime extension per architecture (a Flatpak holds one). Each holds the runtime of both architectures, so
    # it can make programs for both; only the shared libraries of its own architecture are in the extension.
    if: inputs.packages
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            other: arm64
            name: linux-x64
            os: ubuntu-24.04
            triple: aarch64-linux-gnu
            flatpak_other: aarch64
            machine: 183
          - arch: arm64
            other: x86_64
            name: linux-arm64
            os: ubuntu-24.04-arm
            triple: x86_64-linux-gnu
            flatpak_other: x86_64
            machine: 62
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flatpak-stage-*
      - name: Merge the installs of both architectures
        run: |
          # The other architecture first, then this one: its bin (blitzcc, the tools) is what runs here.
          mkdir -p flatpak-stage-root
          tar -C flatpak-stage-root -xf flatpak-stage-linux-${{ matrix.other == 'arm64' && 'arm64' || 'x64' }}/flatpak-stage.tar
          tar -C flatpak-stage-root -xf flatpak-stage-${{ matrix.name }}/flatpak-stage.tar
          . flatpak-stage-root/version.env
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT=blitzllvm-$ARTIFACT_SUFFIX" >> "$GITHUB_ENV"
          mkdir -p build packages
          cp flatpak-stage-root/required-licenses.txt build/
          mv flatpak-stage-root/stage flatpak-stage
      - name: Build the Flatpaks
        run: |
          # The install of the build, packed as two Flatpaks (see packaging/flatpak): the compiler, and the extension with the shared libraries that
          # programs load, which the compiler and every game share. The build was configured without system libraries.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream elfutils
          # Ubuntu 24.04 stops flatpak-builder from making the namespaces of its sandbox otherwise.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # clang for the compiler's own smoke test below; users get it as a dependency of the compiler (add-extensions).
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk.Extension.llvm21//25.08
          packaging/flatpak/split.sh flatpak-stage flatpak-runtime ${{ matrix.arch }}
          sed -i "s/@VERSION@/$VERSION/;s/@DATE@/$(date -u +%Y-%m-%d)/" packaging/flatpak/com.xaymar.BlitzLLVM.metainfo.xml
          appstreamcli validate --no-net --pedantic packaging/flatpak/com.xaymar.BlitzLLVM.metainfo.xml
          # The compiler first, and installed: it declares the extension point that the extension is built against.
          flatpak-builder --user --install --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=flatpak-repo flatpak-build packaging/flatpak/com.xaymar.BlitzLLVM.yml
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=flatpak-repo flatpak-runtime-build packaging/flatpak/com.xaymar.BlitzLLVM.Runtime.yml
          flatpak build-bundle --runtime --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo "packages/${ARTIFACT}-runtime.flatpak" com.xaymar.BlitzLLVM.Runtime 25.08
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo "packages/${ARTIFACT}.flatpak" com.xaymar.BlitzLLVM
          # Licenses and help are in the two together; the shared libraries are in the extension alone.
          (cd flatpak-build/files && find . -type f; cd ../../flatpak-runtime-build/files && find . -type f) | .github/scripts/check-licenses.sh "${ARTIFACT}.flatpak" build/required-licenses.txt
          (cd flatpak-build/files && find . -type f) | .github/scripts/check-help.sh "${ARTIFACT}.flatpak"
          # The compiler must not carry the libraries that the extension has.
          ! (cd flatpak-build/files && find . -name 'libavcodec*' -o -name 'libjxl*' -o -name 'libopus*' | grep .)
          # Install them like a user does, compile a program in the sandbox and run it.
          flatpak uninstall --user --noninteractive com.xaymar.BlitzLLVM
          flatpak install --user --noninteractive --bundle "packages/${ARTIFACT}-runtime.flatpak"
          flatpak install --user --noninteractive --bundle "packages/${ARTIFACT}.flatpak"
          mkdir -p "$HOME/flatpak-smoke"
          echo 'Print "Hello from the Flatpak"' > "$HOME/flatpak-smoke/hello.bb"
          flatpak run --env=BLITZLLVM_HEADLESS=1 com.xaymar.BlitzLLVM -o "$HOME/flatpak-smoke/hello" "$HOME/flatpak-smoke/hello.bb"
          # blitzcc copied no shared library next to the program: the extension has them.
          ! ls "$HOME/flatpak-smoke" | grep -E '\.so'
          "$HOME/flatpak-smoke/hello" | tee smoke.txt
          grep -q "Hello from the Flatpak" smoke.txt
          # The loader finds the libraries of the extension.
          flatpak run --command=sh com.xaymar.BlitzLLVM -c 'ls /app/lib/blitzllvm-shared/lib*avcodec*'
          ls -l packages
      - name: Make a program for the other architecture
        run: |
          # The compiler Flatpak makes programs for both architectures. The C library and the GCC files of the other one come from the SDK of
          # that architecture, given to clang as the sysroot (the user's job, as with every cross compile).
          flatpak install --user --noninteractive --arch=${{ matrix.flatpak_other }} flathub org.freedesktop.Sdk//25.08
          sysroot="$(flatpak info --user --arch=${{ matrix.flatpak_other }} --show-location org.freedesktop.Sdk//25.08)/files"
          flatpak run --env=BLITZLLVM_HEADLESS=1 --filesystem="$sysroot":ro com.xaymar.BlitzLLVM --target ${{ matrix.triple }} --llvm-flag --sysroot="$sysroot" --llvm-flag -fuse-ld=lld -o "$HOME/flatpak-smoke/hello-other" "$HOME/flatpak-smoke/hello.bb"
          ! ls "$HOME/flatpak-smoke" | grep -E '\.so'
          python3 -I -c "import struct,sys; d=open(sys.argv[1],'rb').read(20); assert d[:4]==b'\x7fELF' and struct.unpack('<H',d[18:20])[0]==int(sys.argv[2]), 'wrong architecture'" "$HOME/flatpak-smoke/hello-other" ${{ matrix.machine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: '!inputs.loose'
        with:
          name: ${{ env.ARTIFACT }}-packages
          path: packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.loose
        with:
          path: packages/${{ env.ARTIFACT }}.flatpak
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.loose
        with:
          path: packages/${{ env.ARTIFACT }}-runtime.flatpak
          archive: false


  vscode:
    name: build (vscode extension)
    # The extension is the same on every platform, so it is built once, next to the matrix of the platforms, and only with the packages.
    if: inputs.packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the submodule for the version
        run: git submodule update --init --depth 1 cmake/version
      - name: Determine the version
        run: |
          VERSION="$(cmake -P cmake/project_version.cmake)"
          echo "Version: $VERSION"
          {
            echo "VERSION=$VERSION"
            echo "ARTIFACT=blitzllvm-${VERSION}-vscode"
          } >> "$GITHUB_ENV"
      - name: Package the extension
        # The extension does not contain blitz-lsp: that is in every package of BlitzLLVM, and the extension finds it in PATH or in
        # blitz.installPath. The version of a .vsix has three numbers, the first three of the version of the build.
        working-directory: tools/vscode
        run: |
          python3 ../generate_vscode_grammar.py
          npm install --no-audit --no-fund
          npx vsce package "$(echo "$VERSION" | cut -d. -f1-3)" --no-git-tag-version --no-update-package-json --out "../../${ARTIFACT}.vsix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: '!inputs.loose'
        with:
          # Named like the packages of the other platforms, so that the release takes the file as it is.
          name: ${{ env.ARTIFACT }}-packages
          path: ${{ env.ARTIFACT }}.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.loose
        with:
          path: ${{ env.ARTIFACT }}.vsix
          archive: false
