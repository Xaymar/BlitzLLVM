name: Test

# Runs the whole test suite on Linux, including the tests that need a window and a GPU (the ones ending in _pixels, the
# GUI and the close prompt tests). There is no GPU on the runners, so Mesa's llvmpipe renders Vulkan on the CPU, inside a
# virtual X server (xvfb).
#
# The check that shows up on a pull request is named after the job: "Test (Linux)". Make that one required in the branch
# protection rule or ruleset of root to block merging while the tests fail (see Building in the wiki). This workflow has
# no 'paths' filter on purpose: a required check that is skipped for a pull request stays "pending" and blocks it forever.
# Instead the 'changes' job always runs and decides which tests the commit can affect, and "Test (Linux)" always runs:
#   - a push to root, a manual run, a pull request with the label "run-all-tests" and a change to anything that is shared (the
#     compiler, the runtime core, the build files, the dependencies, this workflow, the selection rules) build and run everything.
#   - a change that only touches one part (the audio code, the 3D code, one test program, the formatter, ...) builds the same way
#     (from the cache if it can), but only runs the tests of that part, and the ones that always run. The others are listed as
#     skipped in the test comment. Skipped tests count as passed.
#   - a change that no test depends on (documentation, the wiki, the other workflows) succeeds without doing anything.
# What belongs to which part is in tests/test_selection.json, and how it works is in docs/wiki/Building.md, Which tests run. A file without a rule
# runs everything. A push to root runs everything, so a rule that skips too much is found there.
#
# The test comment: for pull requests of this repository, a single comment (found by the hidden marker on its first line) lists
# every test with its result in the Debug and in the Release version (.github/scripts/test-report.py renders it,
# .github/scripts/test-comment.sh posts it). It is reset to all tests pending as soon as the run starts, with the list of the
# previous commit, replaced by the current list once the project is configured, and filled with the results at the end, also
# when the tests failed or the run was cancelled. It is separate from the comment about the build of pull-request.yml.

on:
  pull_request:
    branches: [root]
  push:
    branches: [root]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# pull-requests: write is for the comment that lists the tests (see "The test comment" below). The token of a pull request from a
# fork can not write, so those pull requests get no comment, and nothing else changes for them.
permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # all, partial or none, and the whole selection as JSON (see .github/scripts/test-select.py).
      mode: ${{ steps.detect.outputs.mode }}
      selection: ${{ steps.detect.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as the merge with its base: the first parent is the base, so the diff of the two is
          # what the pull request changes. A push only needs the commit it stopped at, which is fetched below.
          fetch-depth: 2
      - name: Detect what changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FORCE=
          case "$EVENT" in
            pull_request)
              BASE=HEAD^1
              # Read from the pull request now, not from the event, so that re-running the workflow after adding the label works.
              if gh api "repos/$GH_REPO/issues/$NUMBER/labels" --jq '.[].name' 2>/dev/null | grep -qx 'run-all-tests'; then
                FORCE='the pull request has the label run-all-tests'
              fi ;;
            push)
              BASE="$BEFORE"
              FORCE='push to root'
              # A new branch or a forced update may point at a commit this clone does not have. Run everything then.
              if ! git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then BASE=; fi ;;
            *)
              BASE=
              FORCE='manual run' ;;
          esac

          : > "$RUNNER_TEMP/changed.txt"
          if [ -n "$BASE" ]; then git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"; fi
          echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"

          # No changed files known (no base to compare with) runs everything.
          SELECTION="$(python3 .github/scripts/test-select.py changes --changed "$RUNNER_TEMP/changed.txt" ${FORCE:+--force "$FORCE"})"
          MODE="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["mode"])' "$SELECTION")"
          echo "Selection: $SELECTION"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "selection=$SELECTION" >> "$GITHUB_OUTPUT"
          {
            echo "### Test selection: $MODE"
            echo
            echo '```json'; echo "$SELECTION"; echo '```'
            echo
            echo "Changed files:"; echo '```'; cat "$RUNNER_TEMP/changed.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reset the test comment
        # Before anything is built, so the comment never shows the results of an older commit.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDED: ${{ steps.detect.outputs.mode != 'none' }}
        run: |
          STATE=pending
          [ "$NEEDED" = true ] || STATE=skipped
          .github/scripts/test-comment.sh get "$NUMBER" > "$RUNNER_TEMP/previous.md"
          python3 .github/scripts/test-report.py --state "$STATE" --sha "$SHA" --run-url "$RUN_URL" --previous "$RUNNER_TEMP/previous.md" > "$RUNNER_TEMP/comment.md"
          .github/scripts/test-comment.sh post "$NUMBER" "$SHA" "$RUNNER_TEMP/comment.md"

  linux:
    name: Test (Linux)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Whether anything the tests depend on changed. If not, every step below is skipped and the job succeeds.
      RUN: ${{ needs.changes.outputs.mode != 'none' }}
      # all or partial: whether only some of the tests run (see .github/scripts/test-select.py).
      MODE: ${{ needs.changes.outputs.mode }}
      SELECTION: ${{ needs.changes.outputs.selection }}
      # SDL wants a runtime directory, and complains on stderr without one, which the close prompt test would read as output.
      XDG_RUNTIME_DIR: /tmp/xdg
      # Pull requests of this repository get the test comment.
      COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the submodules
        if: env.RUN == 'true'
        # The same ones the build needs, and shallow. extra/ holds reference sources only.
        run: git submodule update --init --depth 1 --jobs 8 cmake/version cmake/externalcontent third_party/Vulkan-Headers third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/stb third_party/VulkanMemoryAllocator third_party/FFmpeg
      - name: Hash the dependency submodules
        if: env.RUN == 'true'
        id: dependencies
        run: echo "hash=$(git ls-tree HEAD third_party/ | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Hash everything the build is made from
        if: env.RUN == 'true'
        id: sources
        # The blobs (and for submodules the commits) of what the compiler, the runtime and the tools are built from. The tests are
        # not part of it, so changing them keeps the key, and with it the cached build.
        run: echo "hash=$(git ls-tree -r HEAD code_compiler code_runtime code_tools code_format code_tidy cmake third_party CMakeLists.txt CMakePresets.json .gitmodules LICENSE.adoc .github/workflows/test.yml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install CMake
        if: env.RUN == 'true'
        # From PyPI, which is a few seconds on every runner. The project needs a newer CMake than the runners ship, and this
        # is always the latest one, as with the setup-cmake action it replaces, which downloaded and unpacked CMake each time.
        shell: bash
        run: pipx install cmake && cmake --version
      - name: Date the package cache
        if: env.RUN == 'true'
        id: month
        # Ubuntu publishes updates to these packages, so the cache is replaced every month and never serves old ones for long.
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: env.RUN == 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # The packages and the files they installed are restored from the cache, so apt does not update, download and unpack
          # them on every run. The key is made from the list and the month.
          packages: ninja-build nasm libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev mesa-vulkan-drivers xvfb xdotool x11-utils
          version: 1-${{ steps.month.outputs.month }}
      - name: Create the runtime directory
        if: env.RUN == 'true'
        run: mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
      # The whole build directory. Its key is made of what the build is made from, and there is no restore key on purpose: a
      # partial match would be restored with new modification times on the sources and be compiled again anyway. An exact match
      # is complete, and then neither the dependencies nor the build are needed. It is saved after a run that passed, by the
      # post step of this action. Pull requests read what root saved.
      - name: Cache the build
        if: env.RUN == 'true'
        id: build
        uses: actions/cache@v4
        with:
          path: build
          key: test-build-linux-x64-${{ steps.sources.outputs.hash }}
      # The same cache as the Linux build in pull-request.yml and nightly.yml, with the same key, so the dependencies are
      # restored from what the nightly builds of root saved and are not compiled again.
      - name: Cache dependencies
        if: env.RUN == 'true' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/ExternalContentFiles
          key: submodule-dependencies-linux-x64-${{ hashFiles('code_runtime/dependencies.cmake', 'cmake/externalcontent/ExternalContent.cmake') }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            submodule-dependencies-linux-x64-
      - name: Configure
        # Also with a cached build: the tests are registered when configuring, and the tests may be new.
        if: env.RUN == 'true'
        # The version is made from the date of the commit and is built into the compiler, and the tests compare against it. A
        # cached build keeps the version it was built with (stored next to it), or the tests would expect the new commit's.
        run: |
          mkdir -p build
          [ -f build/blitz-version ] || cmake -P cmake/project_version.cmake > build/blitz-version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLITZ_TEST_GPU=ON -DBLITZLLVM_REQUIRE_NASM=ON -DBlitzLLVM_VERSION="$(cat build/blitz-version)"
      - name: Select the tests
        # The tests are known now (this is also the first point at which a new test is). A partial selection writes the names of the
        # tests to run, and the ones to skip with the reason. If the selection fails for any reason, everything runs.
        if: env.RUN == 'true'
        working-directory: build/code_compiler
        run: |
          ctest -C Release --show-only=json-v1 > "$RUNNER_TEMP/tests.json"
          if ! python3 "$GITHUB_WORKSPACE/.github/scripts/test-select.py" apply --selection "$SELECTION" --tests "$RUNNER_TEMP/tests.json" --selected "$RUNNER_TEMP/selected.txt" --skipped "$RUNNER_TEMP/skipped.json"; then
            echo "::warning::The test selection failed, so every test runs."
            rm -f "$RUNNER_TEMP/selected.txt" "$RUNNER_TEMP/skipped.json"
            MODE=all
            echo "MODE=all" >> "$GITHUB_ENV"
          fi
          [ "$MODE" = partial ] && echo "Running $(wc -l < "$RUNNER_TEMP/selected.txt") tests, skipping $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/skipped.json")." || true
      - name: List the tests in the test comment
        # The comment lists all of them as pending, and the ones that are skipped as skipped.
        if: env.RUN == 'true' && env.COMMENT == 'true'
        continue-on-error: true
        working-directory: build/code_compiler
        run: |
          SKIPPED=(); [ -f "$RUNNER_TEMP/skipped.json" ] && SKIPPED=(--skipped "$RUNNER_TEMP/skipped.json")
          python3 "$GITHUB_WORKSPACE/.github/scripts/test-report.py" --state pending --sha "$SHA" --run-url "$RUN_URL" --tests "$RUNNER_TEMP/tests.json" "${SKIPPED[@]}" > "$RUNNER_TEMP/comment.md"
          "$GITHUB_WORKSPACE/.github/scripts/test-comment.sh" post "$NUMBER" "$SHA" "$RUNNER_TEMP/comment.md"
      - name: Build
        if: env.RUN == 'true' && steps.build.outputs.cache-hit != 'true'
        run: cmake --build build
      - name: Create tests/checker.png
        if: env.RUN == 'true'
        # Some of the suite loads this 64 by 64 picture. It is not in the repository (tests/.gitignore ignores pictures).
        run: |
          python3 - <<'EOF'
          import struct, zlib
          size = 64
          rows = b"".join(b"\x00" + b"".join((b"\xff\xff\xff" if ((x // 8) + (y // 8)) % 2 else b"\x20\x20\x20") for x in range(size)) for y in range(size))
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b"")
          open("tests/checker.png", "wb").write(png)
          EOF
      - name: Run the tests
        if: env.RUN == 'true'
        working-directory: build/code_compiler
        # -j: the GPU tests are small. The ones that move the focus of a window are RUN_SERIAL. A test that skips itself (77)
        # is reported as skipped and does not fail the run. A partial selection runs the tests that the 'Select the tests' step
        # listed (with the fixtures they need), and the others are not part of the results.
        run: |
          SELECTED=(); [ "$MODE" = partial ] && SELECTED=(--tests-from-file "$RUNNER_TEMP/selected.txt")
          xvfb-run -a -s "-screen 0 1280x1024x24" ctest -C Release -j"$(nproc)" --output-on-failure --timeout 600 --output-junit "$RUNNER_TEMP/junit.xml" "${SELECTED[@]}"
      - name: Report the results in the test comment
        # Also after a failure or a cancel, so the comment is never left pending. A run that was cancelled by a newer push is
        # not the head of the pull request anymore, so test-comment.sh leaves the comment to the new run.
        if: always() && env.RUN == 'true' && env.COMMENT == 'true'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=done
          [ "$JOB_STATUS" = cancelled ] && STATE=cancelled
          ARGS=(--tests "$RUNNER_TEMP/tests.json")
          if [ -f "$RUNNER_TEMP/junit.xml" ]; then
            ARGS+=(--junit "$RUNNER_TEMP/junit.xml")
          elif [ "$STATE" = done ]; then
            STATE=failed
          fi
          [ -f "$RUNNER_TEMP/tests.json" ] || ARGS=(--previous /dev/null)
          [ -f "$RUNNER_TEMP/skipped.json" ] && ARGS+=(--skipped "$RUNNER_TEMP/skipped.json")
          python3 .github/scripts/test-report.py --state "$STATE" --sha "$SHA" --run-url "$RUN_URL" "${ARGS[@]}" > "$RUNNER_TEMP/comment.md"
          .github/scripts/test-comment.sh post "$NUMBER" "$SHA" "$RUNNER_TEMP/comment.md"
      - name: Keep what the tests wrote
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/code_compiler/Testing/Temporary/LastTest.log
            build/code_compiler/gui
            build/code_compiler/cli
            build/code_compiler/audio
          if-no-files-found: ignore
      - name: Nothing to test
        if: env.RUN != 'true'
        run: echo "Nothing that the tests depend on changed (documentation, the wiki, other workflows), so there is nothing to test."
