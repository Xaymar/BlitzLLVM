name: Test

# Runs the whole test suite on Linux, Windows and macOS (the jobs "Test (Linux)", "Test (Windows)" and "Test (macOS)"), including the tests that need a window and a GPU (the ones ending in _pixels, the
# GUI and the close prompt tests). There is no GPU on the runners, so Mesa's llvmpipe renders Vulkan on the CPU, inside a
# virtual X server (xvfb).
#
# The checks that show up on a pull request are named after the jobs. Make them required in the branch protection rule or
# ruleset of root to block merging while the tests fail (see Building in the wiki). Windows and macOS use a software Vulkan
# driver (lavapipe, MoltenVK), see the job 'desktop' for what each platform runs. This workflow has
# no 'paths' filter on purpose: a required check that is skipped for a pull request stays "pending" and blocks it forever.
# Instead the 'changes' job always runs and decides which tests the commit can affect, and "Test (Linux)" always runs:
#   - a push to root, a manual run, a pull request with the label "run-all-tests" and a change to anything that is shared (the
#     compiler, the runtime core, the build files, the dependencies, this workflow, the selection rules) build and run everything.
#   - a change that only touches one part (the audio code, the 3D code, one test program, the formatter, ...) builds the same way
#     (from the cache if it can), but only runs the tests of that part, and the ones that always run. The others are listed as
#     skipped in the test comment. Skipped tests count as passed.
#   - a change that no test depends on (documentation, the wiki, the other workflows) succeeds without doing anything.
# What belongs to which part is in tests/test_selection.json, and how it works is in docs/wiki/Building.md, Which tests run. A file without a rule
# runs everything. A push to root runs everything, so a rule that skips too much is found there.
#
# The builds: this workflow is the build of a pull request (it replaces the Pull Request workflow). The jobs Build (...) call build.yml
# for one test platform each, which uploads the build tree next to the packages (when the pull request changes the binaries), and the
# test jobs run ctest on it (.github/actions/prepare-tests). Each platform builds once and tests as soon as its own build is done. The
# other platforms are built by 'Build (other platforms)', which the tests do not wait for. pull-request-comment.yml lists the packages.
#
# The test comment: for pull requests of this repository, a single comment (found by the hidden marker on its first line) lists
# every test with its result in the Debug and in the Release version, a column for each platform (.github/scripts/test-report.py
# renders it, .github/scripts/test-comment.sh posts it). It is reset to pending as soon as the run starts, and written by the job
# 'Test comment' once the three platforms are done, also when the tests failed or the run was cancelled. It is separate from the
# comment about the build of pull-request-comment.yml.

on:
  pull_request:
    branches: [root]
  push:
    branches: [root]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# pull-requests: write is for the comment that lists the tests (see "The test comment" below). The token of a pull request from a
# fork can not write, so those pull requests get no comment, and nothing else changes for them.
permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # all, partial or none, and the whole selection as JSON (see .github/scripts/test-select.py).
      mode: ${{ steps.detect.outputs.mode }}
      selection: ${{ steps.detect.outputs.selection }}
      # Whether the pull request changes the binaries, so that the builds are packaged and uploaded (see .github/scripts/pr-needs-build.sh).
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A push only needs the commit it stopped at, which is fetched below. A pull request needs no history: its changed files
          # come from the API (the whole pull request, not the latest commit).
          fetch-depth: 2
      - name: Detect what changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FORCE=
          case "$EVENT" in
            pull_request)
              BASE=
              # Read from the pull request now, not from the event, so that re-running the workflow after adding the label works.
              if gh api "repos/$GH_REPO/issues/$NUMBER/labels" --jq '.[].name' 2>/dev/null | grep -qx 'run-all-tests'; then
                FORCE='the pull request has the label run-all-tests'
              fi ;;
            push)
              BASE="$BEFORE"
              FORCE='push to root'
              # A new branch or a forced update may point at a commit this clone does not have. Run everything then.
              if ! git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then BASE=; fi ;;
            *)
              BASE=
              FORCE='manual run' ;;
          esac

          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            # Every file the pull request changes against its base (the diff to the merge base), however many commits it has and
            # whichever one was pushed last. No answer runs everything.
            if gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt.new"; then
              mv "$RUNNER_TEMP/changed.txt.new" "$RUNNER_TEMP/changed.txt"
              [ -s "$RUNNER_TEMP/changed.txt" ] || FORCE='the changed files of the pull request are unknown'
            else
              FORCE='the changed files of the pull request are unknown'
            fi
          elif [ -n "$BASE" ]; then git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"; fi
          echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"

          # No changed files known (no base to compare with) runs everything.
          SELECTION="$(python3 .github/scripts/test-select.py changes --changed "$RUNNER_TEMP/changed.txt" ${FORCE:+--force "$FORCE"})"
          MODE="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["mode"])' "$SELECTION")"
          echo "Selection: $SELECTION"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          PACKAGES=false
          [ "$EVENT" != pull_request ] || PACKAGES="$(.github/scripts/pr-needs-build.sh "$NUMBER")"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "selection=$SELECTION" >> "$GITHUB_OUTPUT"
          {
            echo "### Test selection: $MODE"
            echo
            echo '```json'; echo "$SELECTION"; echo '```'
            echo
            echo "Changed files:"; echo '```'; cat "$RUNNER_TEMP/changed.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reset the test comment
        # Before anything is built, so the comment never shows the results of an older commit.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDED: ${{ steps.detect.outputs.mode != 'none' }}
        run: |
          STATE=pending
          [ "$NEEDED" = true ] || STATE=skipped
          python3 .github/scripts/test-report.py --state "$STATE" --sha "$SHA" --run-url "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          .github/scripts/test-comment.sh post "$NUMBER" "$SHA" "$RUNNER_TEMP/comment.md"

  # The tests run on the build of build.yml, which builds each platform once: the jobs build-* call it (without packages, with the
  # build tree uploaded as test-build-<platform>), and the test jobs unpack that and run ctest (.github/actions/prepare-tests). Every
  # platform builds and tests on its own, so a slow platform does not hold back the others.
  build-linux:
    name: Build (Linux)
    needs: changes
    if: needs.changes.outputs.mode != 'none'
    uses: ./.github/workflows/build.yml
    with:
      platforms: ubuntu24.04-x64
      packages: ${{ needs.changes.outputs.packages == 'true' }}
      loose: true
      tests: true

  build-windows:
    name: Build (Windows)
    needs: changes
    if: needs.changes.outputs.mode != 'none'
    uses: ./.github/workflows/build.yml
    with:
      platforms: windows-x64
      packages: ${{ needs.changes.outputs.packages == 'true' }}
      loose: true
      tests: true

  build-macos:
    name: Build (macOS)
    needs: changes
    if: needs.changes.outputs.mode != 'none'
    uses: ./.github/workflows/build.yml
    with:
      platforms: macos-universal
      packages: ${{ needs.changes.outputs.packages == 'true' }}
      loose: true
      tests: true

  # The other platforms and the packages: only for a pull request that changes the binaries. They do not hold back the tests.
  build-other:
    name: Build (other platforms)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/build.yml
    with:
      exclude: ubuntu24.04-x64 windows-x64 macos-universal
      loose: true

  linux:
    name: Test (Linux)
    needs: [changes, build-linux]
    # Also when the build was skipped (nothing to test) or failed (the job fails then), but not when the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Whether anything the tests depend on changed. If not, every step below is skipped and the job succeeds.
      RUN: ${{ needs.changes.outputs.mode != 'none' }}
      # all or partial: whether only some of the tests run (see .github/scripts/test-select.py).
      MODE: ${{ needs.changes.outputs.mode }}
      SELECTION: ${{ needs.changes.outputs.selection }}
      # SDL wants a runtime directory, and complains on stderr without one, which the close prompt test would read as output.
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      - name: The build has to have worked
        if: needs.build-linux.result != 'success' && needs.build-linux.result != 'skipped'
        run: echo "The build failed." && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the submodules
        if: env.RUN == 'true'
        # Only the two with the original samples and games, which the tests compile.
        run: git submodule update --init --depth 1 third_party/blitz3d third_party/blitzplus_msvc2017
      - name: Date the package cache
        if: env.RUN == 'true'
        id: month
        # Ubuntu publishes updates to these packages, so the cache is replaced every month and never serves old ones for long.
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: env.RUN == 'true'
        uses: awalsh128/cache-apt-pkgs-action@5902b33ae29014e6ca012c5d8025d4346556bd40 # v1.4.3
        with:
          # What the build links to at run time, and the software Vulkan driver, the virtual X server and the tools the GUI tests use.
          packages: ninja-build nasm pkg-config libavif-dev libjxl-dev libwebp-dev libopusfile-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev mesa-vulkan-drivers xvfb xdotool x11-utils
          version: 2-${{ steps.month.outputs.month }}
      - name: Create the runtime directory
        if: env.RUN == 'true'
        run: mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
      - name: Prepare the tests
        if: env.RUN == 'true'
        uses: ./.github/actions/prepare-tests
        with:
          platform: ubuntu24.04-x64
      - name: Run the tests
        if: env.RUN == 'true'
        working-directory: build/code_compiler
        # -j: the GPU tests are small. The ones that move the focus of a window are RUN_SERIAL, the ones that move the mouse take turns
        # (RESOURCE_LOCK mouse). A test that skips itself (77) is reported as skipped and does not fail the run. A partial selection
        # runs the tests that the 'Select the tests' step listed (with the fixtures they need).
        run: |
          SELECTED=(); [ "$MODE" = partial ] && SELECTED=(--tests-from-file "$RUNNER_TEMP/selected.txt")
          xvfb-run -a -s "-screen 0 1280x1024x24" ctest -C Release -j"$(nproc)" --output-on-failure --timeout 600 --output-junit "$RUNNER_TEMP/junit.xml" "${SELECTED[@]}"
      - name: Keep the results for the test comment
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-Linux
          path: |
            ${{ runner.temp }}/tests.json
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/skipped.json
          retention-days: 1
          if-no-files-found: ignore
      - name: List the skipped tests
        if: always() && env.RUN == 'true'
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/junit.xml" ] && python3 .github/scripts/test-skipped.py --platform Linux --gpu ON --junit "$RUNNER_TEMP/junit.xml" ${SKIPPED:+--selection-skipped "$SKIPPED"} >> "$GITHUB_STEP_SUMMARY" || true
        env:
          SKIPPED: ${{ runner.temp }}/skipped.json
      - name: Keep what the tests wrote
        if: failure()
        shell: bash
        run: |
          # Tarred because upload-artifact rejects file names with characters such as '*' (cli/shell_quoting/star*).
          existing=(); for p in build/code_compiler/Testing/Temporary/LastTest.log build/code_compiler/gui build/code_compiler/cli build/code_compiler/audio; do [ -e "$p" ] && existing+=("$p"); done
          [ ${#existing[@]} -gt 0 ] && tar -czf "$RUNNER_TEMP/test-output.tar.gz" "${existing[@]}" || true
      - name: Upload what the tests wrote
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output-Linux
          path: ${{ runner.temp }}/test-output.tar.gz
          if-no-files-found: ignore
      - name: Nothing to test
        if: env.RUN != 'true'
        run: echo "Nothing that the tests depend on changed (documentation, the wiki, other workflows), so there is nothing to test."

  windows:
    name: Test (Windows)
    needs: [changes, build-windows]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUN: ${{ needs.changes.outputs.mode != 'none' }}
      MODE: ${{ needs.changes.outputs.mode }}
      SELECTION: ${{ needs.changes.outputs.selection }}
    steps:
      - name: The build has to have worked
        if: needs.build-windows.result != 'success' && needs.build-windows.result != 'skipped'
        run: echo "The build failed." && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the submodules
        if: env.RUN == 'true'
        run: git submodule update --init --depth 1 third_party/blitz3d third_party/blitzplus_msvc2017
      - name: Install a software Vulkan driver
        # The Vulkan loader (vulkan-1.dll) and Mesa's lavapipe (Vulkan on the CPU, like llvmpipe on Linux), which the action registers as a driver.
        if: env.RUN == 'true'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          install_runtime_only: true
          install_runtime: true
          install_lavapipe: true
      - name: Prepare the tests
        if: env.RUN == 'true'
        uses: ./.github/actions/prepare-tests
        with:
          platform: windows-x64
          python: python
      - name: Run the tests
        if: env.RUN == 'true'
        working-directory: build/code_compiler
        env:
          VK_DRIVER_FILES: C:\lavapipe\share\vulkan\icd.d\lvp_icd.x86_64.json
        run: |
          SELECTED=(); [ "$MODE" = partial ] && SELECTED=(--tests-from-file "$RUNNER_TEMP/selected.txt")
          ctest -C Release -j"$(nproc)" --output-on-failure --timeout 600 --output-junit "$RUNNER_TEMP/junit.xml" "${SELECTED[@]}"
      - name: Keep the results for the test comment
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-Windows
          path: |
            ${{ runner.temp }}/tests.json
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/skipped.json
          retention-days: 1
          if-no-files-found: ignore
      - name: List the skipped tests
        if: always() && env.RUN == 'true'
        continue-on-error: true
        env:
          SKIPPED: ${{ runner.temp }}/skipped.json
        run: |
          [ -f "$RUNNER_TEMP/junit.xml" ] && python .github/scripts/test-skipped.py --platform Windows --gpu ON --junit "$RUNNER_TEMP/junit.xml" ${SKIPPED:+--selection-skipped "$SKIPPED"} >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep what the tests wrote
        if: failure()
        shell: bash
        run: |
          # Tarred because upload-artifact rejects file names with characters such as '*' (cli/shell_quoting/star*).
          existing=(); for p in build/code_compiler/Testing/Temporary/LastTest.log build/code_compiler/gui build/code_compiler/cli; do [ -e "$p" ] && existing+=("$p"); done
          [ ${#existing[@]} -gt 0 ] && tar -czf "$RUNNER_TEMP/test-output.tar.gz" "${existing[@]}" || true
      - name: Upload what the tests wrote
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output-Windows
          path: ${{ runner.temp }}/test-output.tar.gz
          if-no-files-found: ignore
      - name: Nothing to test
        if: env.RUN != 'true'
        run: echo "Nothing that the tests depend on changed (documentation, the wiki, other workflows), so there is nothing to test."

  macos:
    name: Test (macOS)
    needs: [changes, build-macos]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RUN: ${{ needs.changes.outputs.mode != 'none' }}
      MODE: ${{ needs.changes.outputs.mode }}
      SELECTION: ${{ needs.changes.outputs.selection }}
    steps:
      - name: The build has to have worked
        if: needs.build-macos.result != 'success' && needs.build-macos.result != 'skipped'
        run: echo "The build failed." && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the submodules
        if: env.RUN == 'true'
        run: git submodule update --init --depth 1 third_party/blitz3d third_party/blitzplus_msvc2017
      - name: Install MoltenVK
        # The Vulkan driver, loaded directly (SDL_VULKAN_LIBRARY below), so no Vulkan loader is needed. It needs Metal.
        if: env.RUN == 'true'
        run: brew install molten-vk
      - name: Prepare the tests
        if: env.RUN == 'true'
        uses: ./.github/actions/prepare-tests
        with:
          platform: macos-universal
      - name: Run the tests
        if: env.RUN == 'true'
        working-directory: build/code_compiler
        run: |
          PREFIX="$(brew --prefix molten-vk)"
          export SDL_VULKAN_LIBRARY="$PREFIX/lib/libMoltenVK.dylib" VK_ICD_FILENAMES="$PREFIX/etc/vulkan/icd.d/MoltenVK_icd.json"
          SELECTED=(); [ "$MODE" = partial ] && SELECTED=(--tests-from-file "$RUNNER_TEMP/selected.txt")
          # Without a Metal device MoltenVK has no GPU to show: leave out the tests that need a window and a GPU (labeled gpu).
          GPU=(); GPUSTATE=ON
          if ! system_profiler SPDisplaysDataType 2>/dev/null | grep -q 'Metal'; then
            echo "::warning::This runner has no Metal device, so the tests that need a window and a GPU are left out."
            GPU=(-LE gpu); GPUSTATE=OFF
            # They show as skipped (not as not run) in the test comment.
            python3 - <<'PYTHON'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          path = os.path.join(temp, "skipped.json")
          skipped = json.load(open(path)) if os.path.exists(path) else {}
          for test in json.load(open(os.path.join(temp, "tests.json")))["tests"]:
              labels = [p["value"] for p in test.get("properties", []) if p["name"] == "LABELS"]
              if any("gpu" in label for label in labels):
                  skipped.setdefault(test["name"], "No Metal device on the runner")
          json.dump(skipped, open(path, "w"))
          PYTHON
          fi
          echo "GPUSTATE=$GPUSTATE" >> "$GITHUB_ENV"
          ctest -C Release -j"$(sysctl -n hw.ncpu)" --output-on-failure --timeout 600 --output-junit "$RUNNER_TEMP/junit.xml" "${GPU[@]}" "${SELECTED[@]}"
      - name: Keep the results for the test comment
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-macOS
          path: |
            ${{ runner.temp }}/tests.json
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/skipped.json
          retention-days: 1
          if-no-files-found: ignore
      - name: List the skipped tests
        if: always() && env.RUN == 'true'
        continue-on-error: true
        env:
          SKIPPED: ${{ runner.temp }}/skipped.json
        run: |
          [ -f "$RUNNER_TEMP/junit.xml" ] && python3 .github/scripts/test-skipped.py --platform macOS --gpu "${GPUSTATE:-ON}" --junit "$RUNNER_TEMP/junit.xml" ${SKIPPED:+--selection-skipped "$SKIPPED"} >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep what the tests wrote
        if: failure()
        shell: bash
        run: |
          # Tarred because upload-artifact rejects file names with characters such as '*' (cli/shell_quoting/star*).
          existing=(); for p in build/code_compiler/Testing/Temporary/LastTest.log build/code_compiler/gui build/code_compiler/cli build/code_compiler/audio; do [ -e "$p" ] && existing+=("$p"); done
          [ ${#existing[@]} -gt 0 ] && tar -czf "$RUNNER_TEMP/test-output.tar.gz" "${existing[@]}" || true
      - name: Upload what the tests wrote
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output-macOS
          path: ${{ runner.temp }}/test-output.tar.gz
          if-no-files-found: ignore
      - name: Nothing to test
        if: env.RUN != 'true'
        run: echo "Nothing that the tests depend on changed (documentation, the wiki, other workflows), so there is nothing to test."

  # One comment for the three platforms, with a column for each (see "The test comment" above). It is written when the platforms
  # are done, and also after a failure or a cancel, so the comment is never left pending. A run that was cancelled by a newer push is
  # not the head of the pull request anymore, so test-comment.sh leaves the comment to the new run.
  report:
    name: Test comment
    needs: [changes, linux, windows, macos]
    if: always() && needs.changes.outputs.mode != 'none' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: test-results-*
          path: results
      - name: Write the test comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          STATE=done
          case " $RESULTS " in *" cancelled "*) STATE=cancelled ;; esac
          ARGS=()
          for P in Linux Windows macOS; do
            ARGS+=(--platform "$P=results/test-results-$P/tests.json,results/test-results-$P/junit.xml,results/test-results-$P/skipped.json")
          done
          # A platform that did not write its results failed before (or while) running the tests.
          if [ "$STATE" = done ]; then
            for P in Linux Windows macOS; do [ -f "results/test-results-$P/junit.xml" ] || STATE=failed; done
          fi
          python3 .github/scripts/test-report.py --state "$STATE" --sha "$SHA" --run-url "$RUN_URL" "${ARGS[@]}" > comment.md
          .github/scripts/test-comment.sh post "$NUMBER" "$SHA" comment.md
