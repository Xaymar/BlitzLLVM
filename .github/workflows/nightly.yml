name: Nightly

on:
  push:
    branches: [root]
    paths:
      # Only what changes the binaries. Documentation, the wiki, the tests and the tools do not.
      - 'code_compiler/**'
      - 'code_runtime/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.gitmodules'
      - 'LICENSE.adoc'
      - '.github/scripts/check-licenses.sh'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/build.yml'
  # By hand, for a commit that no push built (one that only changed documentation), so that it can be released. Only a run on
  # root replaces the nightly release.
  workflow_dispatch:
  # The Periodic workflow builds the daily, weekly, monthly and yearly releases with this workflow, without caches.
  workflow_call:
    inputs:
      clean:
        description: 'Build without restoring or saving any cache, from a fresh checkout'
        type: boolean
        default: false
      tags:
        description: 'Moving releases to publish instead of nightly, separated by spaces (empty with clean: only build)'
        type: string
        default: ''

# A clean build must not cancel a nightly build, nor be cancelled by one.
concurrency:
  group: ${{ inputs.clean && 'nightly-clean' || 'nightly' }}
  cancel-in-progress: ${{ !inputs.clean }}

jobs:
  build:
    # The platforms, packages and their checks are in build.yml, which the Test workflow uses as well.
    uses: ./.github/workflows/build.yml
    with:
      clean: ${{ inputs.clean == true }}

  release:
    needs: build
    # A clean build without tags only checks that it builds.
    if: ${{ !inputs.clean || inputs.tags != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Determine the version
        # The same one as in the builds, from the commit date.
        run: |
          git submodule update --init --depth 1 cmake/version
          echo "VERSION=$(cmake -P cmake/project_version.cmake)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish nightly release
        # A manual run of another branch only proves that it builds.
        if: ${{ !inputs.clean && github.ref == 'refs/heads/root' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release
          for d in artifacts/*; do
            case "$d" in
              # Packages are already named after their version and platform.
              *-packages) mv "$d"/* release/ ;;
              *) (cd "$d" && zip -qr "../../release/$(basename "$d").zip" .) ;;
            esac
          done
          ls -l release
          TITLE="Nightly ${VERSION} (${GITHUB_SHA::7})"
          NOTES="Automated build of ${GITHUB_SHA}, version ${VERSION}."
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          # The tag stays on a single blank commit that has no files, so it can never collide with real history. It is only
          # created once; later builds just update the release and its assets.
          if [ -z "$(git ls-remote --tags "$REMOTE" refs/tags/nightly)" ]; then
            # In a repository of its own: here it would be a commit on top of the checkout, with all of its files.
            BLANK="$(mktemp -d)"
            git -C "$BLANK" init -q
            git -C "$BLANK" -c user.name=github-actions -c user.email=actions@github.com commit -q --allow-empty -m "Nightly"
            git -C "$BLANK" push -q "$REMOTE" HEAD:refs/tags/nightly
            rm -rf "$BLANK"
          fi
          if gh release view nightly >/dev/null 2>&1; then
            # New files first, so the release is never without binaries (a cancelled or failed run would leave it empty
            # otherwise). Asset names contain the version, so the previous ones are different files: remove those afterwards.
            gh release upload nightly release/* --clobber
            gh release edit nightly --prerelease --title "$TITLE" --notes "$NOTES"
            gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
              [ -e "release/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly release/* --prerelease --verify-tag --title "$TITLE" --notes "$NOTES"
          fi
      - name: Publish the moving releases
        if: ${{ inputs.clean }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          mkdir release
          for d in artifacts/*; do
            case "$d" in
              *-packages) mv "$d"/* release/ ;;
              *) (cd "$d" && zip -qr "../../release/$(basename "$d").zip" .) ;;
            esac
          done
          ls -l release
          # shellcheck disable=SC2086
          python3 .github/scripts/periodic.py publish $TAGS --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --version "$VERSION" --files release
