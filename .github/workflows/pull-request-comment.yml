name: Pull Request Comment

# Reports the result of the 'Pull Request' workflow in the pull request, with links to the built binaries. A single comment
# is kept per pull request and updated by every run.
#
# This runs on workflow_run, in the context of the base repository, so that it can comment on pull requests from forks too.
# For the same reason it never checks out or executes anything from the pull request. The only thing taken from the run is the
# pull request number, which is validated before use. workflow_run only triggers for workflows on the default branch, so this
# starts working once it was merged.

on:
  workflow_run:
    workflows: ['Pull Request']
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # A cancelled run was superseded by a newer push and has nothing to report.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pull-request-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # The file comes from the pull request's workflow run, so treat it as untrusted.
          NUMBER="$(head -c 16 pull-request-number | tr -d '[:space:]')"
          case "$NUMBER" in
            ''|*[!0-9]*) echo "Invalid pull request number."; exit 1 ;;
          esac

          # Only report on the commit that is still the head of the pull request.
          CURRENT="$(gh api "repos/${GH_REPO}/pulls/${NUMBER}" --jq .head.sha)"
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "The pull request moved on to ${CURRENT}, skipping."
            exit 0
          fi

          MARKER='<!-- blitzllvm-pr-build -->'
          if [ "$CONCLUSION" = success ]; then STATUS='✅ Build succeeded'; else STATUS='❌ Build failed'; fi
          {
            echo "$MARKER"
            echo "## ${STATUS}"
            echo
            echo "Commit \`${HEAD_SHA::7}\` · [Workflow run](${RUN_URL})"
            echo
            ROWS="$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name != \"pull-request-info\" and .expired == false) | \"| [\(.name)](https://github.com/${GH_REPO}/actions/runs/${RUN_ID}/artifacts/\(.id)) | \(.size_in_bytes / 1048576 * 10 | round / 10) MiB |\"" | sort)"
            if [ -n "$ROWS" ]; then
              echo '| Binaries | Size |'
              echo '| --- | --- |'
              echo "$ROWS"
              echo
              echo '_Downloading artifacts requires being signed in to GitHub. They expire after 90 days._'
            else
              echo 'No binaries were produced.'
            fi
          } > comment.md

          # Update our comment if there is one, otherwise create it.
          ID="$(gh api --paginate "repos/${GH_REPO}/issues/${NUMBER}/comments" \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"${MARKER}\")))][0].id // empty" | head -n1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${ID}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${NUMBER}/comments" -F body=@comment.md > /dev/null
          fi
