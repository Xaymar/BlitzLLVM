name: Pull Request Comment

# Lists the builds of the 'Pull Request' workflow in the pull request, with links to the built binaries. A single comment is
# kept per pull request: the newest commit is listed in full, the commits before it are folded into <details> blocks (see
# .github/scripts/pr-build-report.py). The comment is only touched when a build starts ("Build pending" for that commit) or
# finishes (the result), so a pull request that causes no build never gets or changes a comment.
#
# This runs on workflow_run, in the context of the base repository, so that it can comment on pull requests from forks too
# without using pull_request_target. For the same reason it never checks out or executes anything from the pull request. The
# only things taken from the triggering run are its id, URL, head commit and conclusion (GitHub generated, hex / numeric), and
# the branch of the head repository, which is passed through an environment variable and only used to look up the pull request.
# workflow_run only triggers for workflows on the default branch, so this starts working once it was merged.

on:
  workflow_run:
    workflows: ['Pull Request']
    types: [requested, completed]

permissions:
  actions: read
  pull-requests: write

# Serialized per commit's branch, so a "pending" and a result can not interleave their updates of the comment.
concurrency:
  group: pull-request-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      # Only the scripts of the base repository, never anything of the pull request.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTION: ${{ github.event.action }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # Find the pull request of the run, and only report on the commit that is still its head.
          NUMBER="$(gh api "repos/${GH_REPO}/pulls" -f state=open -f head="${HEAD_OWNER}:${HEAD_BRANCH}" --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number" | head -n1)"
          case "$NUMBER" in
            '') echo "No open pull request has ${HEAD_SHA} as its head, skipping."; exit 0 ;;
            *[!0-9]*) echo "Invalid pull request number."; exit 1 ;;
          esac

          if [ "$ACTION" = requested ]; then
            STATE=pending
          else
            case "$CONCLUSION" in
              success) STATE=success ;;
              cancelled) STATE=cancelled ;;
              *) STATE=failure ;;
            esac
          fi

          MARKER='<!-- blitzllvm-pr-build -->'
          ID="$(gh api --paginate "repos/${GH_REPO}/issues/${NUMBER}/comments" \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"${MARKER}\")))][0] | select(. != null) | .id" | head -n1)"
          ARGS=()
          if [ -n "$ID" ]; then
            gh api "repos/${GH_REPO}/issues/comments/${ID}" --jq .body > previous.md
            ARGS+=(--previous previous.md)
          fi

          if [ "$STATE" != pending ]; then
            gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.expired == false) | \"| [\(.name)](https://github.com/${GH_REPO}/actions/runs/${RUN_ID}/artifacts/\(.id)) | \(.size_in_bytes / 1048576 * 10 | round / 10) MiB |\"" | sort > rows.md
            ARGS+=(--rows rows.md)
          fi

          python3 .github/scripts/pr-build-report.py --sha "$HEAD_SHA" --state "$STATE" --run-url "$RUN_URL" "${ARGS[@]}" > comment.md

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${ID}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${NUMBER}/comments" -F body=@comment.md > /dev/null
          fi
