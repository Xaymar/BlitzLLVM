name: Promote

# Once a day, copies the latest nightly build into the daily, weekly, monthly and yearly releases, each of which is
# replaced at most once per day, week, month and year. See docs/wiki/Releasing.md. Scheduled runs are not pull request checks,
# and these tags do not match the patterns of the Release workflow, so neither is involved.
on:
  schedule:
    # 05:00 UTC, after the pushes of the previous day have been built by the Nightly workflow.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'What to promote, separated by spaces: daily weekly monthly yearly (empty: all)'
        default: ''
      dry_run:
        description: 'Only print what would be promoted'
        type: boolean
        default: true
      force:
        description: 'Promote even if the nightly is already held or the period has not ended'
        type: boolean
        default: false

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    # A fork has no nightly builds of its own to promote.
    if: github.repository == 'Xaymar/BlitzLLVM' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Only the script is needed, not the history.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Promote the nightly build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
          # Scheduled runs have no inputs: they promote for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ "$FORCE" = true ] && args+=(--force)
          # shellcheck disable=SC2086
          python3 .github/scripts/promote.py $TAGS --repo "$GITHUB_REPOSITORY" "${args[@]}"
