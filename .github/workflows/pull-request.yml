name: Pull Request

# Builds every pull request that changes the binaries to verify that it compiles (see .github/scripts/pr-needs-build.sh; a pull
# request that only changes documentation or tests gets no build, and no comment). That decision looks at every file the whole
# pull request changes, not at the latest commit, and every new commit cancels the run of the one before. The pull request
# comment is written by pull-request-comment.yml (when a build starts and when it finished), because pull requests from forks
# only get a read-only token here and can not comment themselves.

on:
  pull_request:
    branches: [root]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      - name: Detect whether the binaries change
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "build=$(.github/scripts/pr-needs-build.sh "$NUMBER")" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      # One platform failing fails the whole run: the other platforms are cancelled instead of building to the end.
      fail-fast: true
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, platform: x64, msystem: UCRT64, msys: 'make nasm diffutils mingw-w64-ucrt-x86_64-gcc' }
          - { name: windows-arm64, os: windows-11-arm, platform: ARM64, msystem: CLANGARM64, msys: 'make diffutils mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-libwinpthread' }
          # Each Linux package is built on the system it is made for: the deb on both Ubuntu LTS releases (26.04 is a public
          # preview runner), the rpm in Fedora and the Arch package in Arch Linux (which has no arm64 container image). The snap
          # is made from the 24.04 build (core24).
          - { name: ubuntu24.04-x64, os: ubuntu-24.04, kind: deb, snap: true }
          - { name: ubuntu26.04-x64, os: ubuntu-26.04, kind: deb }
          - { name: fedora-x64, os: ubuntu-latest, container: 'fedora:latest', kind: rpm }
          - { name: arch-x64, os: ubuntu-latest, container: 'archlinux:latest', kind: pacman }
          - { name: ubuntu24.04-arm64, os: ubuntu-24.04-arm, kind: deb, snap: true }
          - { name: ubuntu26.04-arm64, os: ubuntu-26.04-arm, kind: deb }
          - { name: fedora-arm64, os: ubuntu-24.04-arm, container: 'fedora:latest', kind: rpm }
          - { name: macos-universal, os: macos-latest, architectures: 'arm64;x86_64' }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Containers have no git yet when checkout runs, so it is installed first.
      - name: Install git for checkout
        if: matrix.container
        run: |
          if command -v dnf >/dev/null; then dnf install -y git tar; else pacman -Syu --noconfirm git tar; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trust the checkout
        # The container user is not the owner of the workspace, and git refuses to work in it otherwise.
        if: matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out the submodules
        # Only the ones the build needs, and shallow. extra/ holds reference sources only, except for the two with the original samples and games, which are packaged.
        run: git submodule update --init --depth 1 --jobs 8 cmake/version cmake/externalcontent third_party/Vulkan-Headers third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/stb third_party/VulkanMemoryAllocator third_party/FFmpeg extra/blitz3d extra/blitzplus_msvc2017
      - name: Hash the dependency submodules
        id: dependencies
        shell: bash
        # The recorded commits of third_party/, so that updating a submodule changes the cache key.
        run: echo "hash=$(git ls-tree HEAD third_party/ | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install Fedora dependencies
        if: matrix.kind == 'rpm'
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ make git tar zstd which findutils diffutils perl python3-pip pipx ninja-build nasm clang lld zlib-ng-compat-static libX11-devel libXext-devel libXcursor-devel libXi-devel libXrandr-devel libXScrnSaver-devel libXtst-devel libXfixes-devel wayland-devel wayland-protocols-devel libxkbcommon-devel libdecor-devel alsa-lib-devel pulseaudio-libs-devel systemd-devel libdrm-devel mesa-libgbm-devel mesa-libEGL-devel rpm-build
      - name: Install Arch dependencies
        if: matrix.kind == 'pacman'
        run: pacman -Syu --noconfirm --needed base-devel git zstd nasm ninja clang lld python-pipx python-filelock libx11 libxext libxcursor libxi libxrandr libxss libxtst libxfixes wayland wayland-protocols libxkbcommon libdecor alsa-lib libpulse systemd-libs libdrm mesa libarchive ruby ruby-stdlib
      - name: Install CMake
        # From PyPI, which is a few seconds on every runner. The project needs a newer CMake than the runners ship, and this
        # is a fixed version, so the release binaries are not built with a CMake that nobody looked at; raise it by hand.
        shell: bash
        run: |
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cmake --version
      - name: Determine the version
        # From the commit date (see cmake/project_version.cmake), so every platform of a run gets the same version without a job of
        # its own in front of the builds.
        shell: bash
        run: |
          VERSION="$(cmake -P cmake/project_version.cmake)"
          echo "Version: $VERSION"
          {
            echo "VERSION=$VERSION"
            echo "ARTIFACT=blitzllvm-${VERSION}-${{ matrix.name }}"
          } >> "$GITHUB_ENV"
      - name: Date the package cache
        id: month
        if: runner.os == 'Linux'
        # Ubuntu publishes updates to these packages, so the cache is replaced every month and never serves old ones for long.
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Install Linux dependencies for SDL
        if: matrix.kind == 'deb'
        uses: awalsh128/cache-apt-pkgs-action@5902b33ae29014e6ca012c5d8025d4346556bd40 # v1.4.3
        with:
          # The packages and the files they installed are restored from the cache, so apt does not update, download and unpack
          # them on every run. The key is made from the list and the month.
          packages: ninja-build nasm pkg-config libavif-dev libjxl-dev libwebp-dev libopusfile-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev rpm libarchive-tools zstd
          version: 1-${{ runner.arch }}-${{ steps.month.outputs.month }}
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm
      # dav1d (AVIF) has assembly for x86, which NASM builds.
      - name: Install Windows dependencies
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      # FFmpeg (movies) has a configure script, so on Windows it is built in MSYS2 (see code_runtime/dependencies.cmake).
      - name: Install MSYS2 for FFmpeg
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys }}
      - name: Tell the build where MSYS2 is
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BLITZLLVM_MSYS2=${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"
      # SDL3, SDL3_image (with its AVIF, JPEG XL and WebP codecs), SDL3_mixer and the Vulkan headers come from the submodules in third_party/ and are built by ExternalContent (see code_runtime/dependencies.cmake),
      # which skips every stage whose inputs are unchanged. Restoring its directory therefore skips their compilation entirely. Their
      # build options are defined in that file, so it is part of the key, and so are the ExternalContent module and the commits of the dependency submodules.
      # Pull requests restore the caches that nightly builds of root save, and only save one of their own when none exists yet.
      # The prefix is not shared with the caches from before the dependencies were submodules, as those were built from another source directory.
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ExternalContentFiles
          key: submodule-dependencies-${{ matrix.name }}-${{ hashFiles('code_runtime/dependencies.cmake', 'cmake/externalcontent/ExternalContent.cmake') }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            submodule-dependencies-${{ matrix.name }}-
      - name: Configure
        shell: bash
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.platform }} -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON -DBLITZLLVM_REQUIRE_HELP=ON
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${ARCHITECTURES:+-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES"} -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON -DBLITZLLVM_REQUIRE_HELP=ON
          fi
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        # Linux ships only the deb, rpm and Arch packages (see below), no archive.
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist
          cp LICENSE.adoc README.adoc dist/
          # The libraries must not need the newer STL helpers (__std_rotate, ...), or programs fail to link with an older Visual Studio.
          [ "$RUNNER_OS" != Windows ] || .github/scripts/check-std-helpers.sh dist
          find dist -type f -exec ls -l {} + | sort -k5 -n -r
          # Zipped here, so the artifact is the .zip file itself and its name carries the extension.
          (cd dist && cmake -E tar cf "../${ARTIFACT}.zip" --format=zip .)
          cmake -E tar tf "${ARTIFACT}.zip" | .github/scripts/check-licenses.sh "${ARTIFACT}.zip" build/required-licenses.txt
          cmake -E tar tf "${ARTIFACT}.zip" | .github/scripts/check-help.sh "${ARTIFACT}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os != 'Linux'
        with:
          path: ${{ env.ARTIFACT }}.zip
          archive: false
      - name: Build the deb (Linux)
        if: matrix.kind == 'deb'
        run: |
          mkdir packages
          (cd build && cpack -G DEB -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          rm -rf packages/_CPack_Packages
          mv packages/*.deb "packages/${ARTIFACT}.deb"
          # Every package has to list the licenses
          dpkg-deb --contents "packages/${ARTIFACT}.deb" | awk '{print $NF}' | .github/scripts/check-licenses.sh "${ARTIFACT}.deb" build/required-licenses.txt
          dpkg-deb --contents "packages/${ARTIFACT}.deb" | awk '{print $NF}' | .github/scripts/check-help.sh "${ARTIFACT}.deb"
          ls -l packages
      - name: Build the rpm (Linux)
        if: matrix.kind == 'rpm'
        run: |
          mkdir packages
          (cd build && cpack -G RPM -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          rm -rf packages/_CPack_Packages
          mv packages/*.rpm "packages/${ARTIFACT}.rpm"
          rpm -qlp "packages/${ARTIFACT}.rpm" | .github/scripts/check-licenses.sh "${ARTIFACT}.rpm" build/required-licenses.txt
          rpm -qlp "packages/${ARTIFACT}.rpm" | .github/scripts/check-help.sh "${ARTIFACT}.rpm"
          ls -l packages
      - name: Build the Arch package (Linux)
        if: matrix.kind == 'pacman'
        run: |
          mkdir packages
          gem install --no-document fpm -v 1.18.0
          # Arch installs gems into the user's directory, which is not on the PATH.
          export PATH="$(gem env gemdir)/bin:$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          DESTDIR="$PWD/stage" cmake --install build --config Release --component system --prefix /usr
          fpm -s dir -t pacman -n blitzllvm -v "$VERSION" --description "BlitzBasic compiler built on LLVM" \
            --url https://github.com/Xaymar/BlitzLLVM --license BSD-3-Clause --depends clang --depends vulkan-icd-loader \
            -p "packages/${ARTIFACT}.pkg.tar.zst" -C stage usr
          bsdtar -tf "packages/${ARTIFACT}.pkg.tar.zst" | .github/scripts/check-licenses.sh "${ARTIFACT}.pkg.tar.zst" build/required-licenses.txt
          bsdtar -tf "packages/${ARTIFACT}.pkg.tar.zst" | .github/scripts/check-help.sh "${ARTIFACT}.pkg.tar.zst"
          ls -l packages
      - name: Build the snap (Linux)
        if: matrix.snap
        run: |
          # The files of the deb are packed again as a classic snap, see snap/snapcraft.yaml. ubuntu-24.04 matches its base, core24.
          mkdir -p snap-stage
          DESTDIR="$PWD/snap-stage" cmake --install build --config Release --component system --prefix /usr
          sed -i "s/@VERSION@/$VERSION/" snap/snapcraft.yaml
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode --output "packages/${ARTIFACT}.snap"
          unsquashfs -l "packages/${ARTIFACT}.snap" | awk '{print $NF}' | .github/scripts/check-licenses.sh "${ARTIFACT}.snap" build/required-licenses.txt
          unsquashfs -l "packages/${ARTIFACT}.snap" | awk '{print $NF}' | .github/scripts/check-help.sh "${ARTIFACT}.snap"
          ls -l packages
      - name: Build packages (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir packages
          (cd build && cpack -G productbuild -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          rm -rf packages/_CPack_Packages
          mv packages/*.pkg "packages/${ARTIFACT}.pkg"
          pkgutil --payload-files "packages/${ARTIFACT}.pkg" | .github/scripts/check-licenses.sh "${ARTIFACT}.pkg" build/required-licenses.txt
          pkgutil --payload-files "packages/${ARTIFACT}.pkg" | .github/scripts/check-help.sh "${ARTIFACT}.pkg"
          ls -l packages
      # Every package is uploaded on its own with 'archive: false', so it is a separate entry that is not zipped. The artifact is
      # named after the file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.kind == 'deb'
        with:
          path: packages/${{ env.ARTIFACT }}.deb
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.kind == 'rpm'
        with:
          path: packages/${{ env.ARTIFACT }}.rpm
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.kind == 'pacman'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg.tar.zst
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.snap
        with:
          path: packages/${{ env.ARTIFACT }}.snap
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'macOS'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg
          archive: false
