name: Pull Request

# Builds every pull request to verify that it compiles. The results are reported by pull-request-comment.yml, because
# pull requests from forks only get a read-only token here and can not comment themselves.

on:
  pull_request:
    branches: [root]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine the version
        id: version
        # Computed once from the commit date (see cmake/project_version.cmake), and handed to every build, so all artifacts of a
        # run carry the same version.
        run: |
          git submodule update --init --depth 1 cmake/version cmake/externalcontent
          VERSION="$(cmake -P cmake/project_version.cmake)"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every file a run produces is named blitzllvm-<version>-<platform>.<extension>.
      ARTIFACT: blitzllvm-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out cmake-version and cmake-externalcontent
        run: git submodule update --init --depth 1 cmake/version cmake/externalcontent
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: latest
      - name: Install Linux dependencies for SDL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      # dav1d (AVIF) has assembly for x86, which NASM builds.
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      # SDL3, SDL3_image (with its AVIF, JPEG XL and WebP codecs), SDL3_mixer and the Vulkan headers are cloned and built by ExternalContent (see code_runtime/dependencies.cmake),
      # which skips every stage whose inputs are unchanged. Restoring its directory therefore skips their compilation entirely. Their
      # versions and build options are all defined in that file, so it is part of the key, and so is the checked out ExternalContent module (hashed by content, so a submodule bump changes the key).
      # Pull requests restore the caches that nightly builds of root save, and only save one of their own when none exists yet.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ExternalContentFiles
          key: dependencies-${{ matrix.name }}-${{ hashFiles('code_runtime/dependencies.cmake', 'cmake/externalcontent/ExternalContent.cmake') }}
          restore-keys: |
            dependencies-${{ matrix.name }}-
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DBlitzLLVM_VERSION="$VERSION"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBlitzLLVM_VERSION="$VERSION"
          fi
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist
          cp LICENSE.adoc README.adoc dist/
          # Zipped here, so the artifact is the .zip file itself and its name carries the extension.
          (cd dist && cmake -E tar cf "../${ARTIFACT}.zip" --format=zip .)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARTIFACT }}.zip
          archive: false
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm libarchive-tools zstd
          sudo gem install --no-document fpm
      - name: Build packages (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir packages
          # deb and rpm
          for generator in DEB RPM; do
            (cd build && cpack -G $generator -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          done
          # Arch Linux
          DESTDIR="$PWD/stage" cmake --install build --config Release --component system --prefix /usr
          fpm -s dir -t pacman -n blitzllvm -v "$VERSION" --description "BlitzBasic compiler built on LLVM" \
            --url https://github.com/Xaymar/BlitzLLVM --license BSD-3-Clause --depends clang --depends vulkan-icd-loader \
            -p "packages/${ARTIFACT}.pkg.tar.zst" -C stage usr
          rm -rf packages/_CPack_Packages
          mv packages/*.deb "packages/${ARTIFACT}.deb"
          mv packages/*.rpm "packages/${ARTIFACT}.rpm"
          ls -l packages
      - name: Build packages (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir packages
          (cd build && cpack -G productbuild -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          rm -rf packages/_CPack_Packages
          mv packages/*.pkg "packages/${ARTIFACT}.pkg"
          ls -l packages
      # Every package is uploaded on its own with 'archive: false', so it is a separate entry that is not zipped. The artifact is
      # named after the file.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: packages/${{ env.ARTIFACT }}.deb
          archive: false
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: packages/${{ env.ARTIFACT }}.rpm
          archive: false
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg.tar.zst
          archive: false
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg
          archive: false

  # Hands the pull request number to pull-request-comment.yml, which runs outside of the pull request's context.
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Record the pull request
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$NUMBER" > pull-request-number
      - uses: actions/upload-artifact@v4
        with:
          name: pull-request-info
          path: pull-request-number
