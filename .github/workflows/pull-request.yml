name: Pull Request

# Builds every pull request that changes the binaries to verify that it compiles (see paths below; a pull request that only
# changes documentation or tests gets no build, and no comment). The pull request comment is created by pull-request-pending.yml and
# filled with the results by pull-request-comment.yml, because
# pull requests from forks only get a read-only token here and can not comment themselves.

on:
  pull_request:
    branches: [root]
    paths:
      # Only what changes the binaries. Documentation, the wiki, the tests and the tools do not.
      - 'code_compiler/**'
      - 'code_runtime/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.gitmodules'
      - 'LICENSE.adoc'
      - '.github/scripts/check-licenses.sh'
      - '.github/workflows/pull-request.yml'

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine the version
        id: version
        # Computed once from the commit date (see cmake/project_version.cmake), and handed to every build, so all artifacts of a
        # run carry the same version.
        run: |
          git submodule update --init --depth 1 --jobs 8 cmake/version cmake/externalcontent
          VERSION="$(cmake -P cmake/project_version.cmake)"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      # One platform failing fails the whole run: the other platforms are cancelled instead of building to the end.
      fail-fast: true
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, platform: x64, msystem: UCRT64, msys: 'make nasm diffutils mingw-w64-ucrt-x86_64-gcc' }
          - { name: windows-arm64, os: windows-11-arm, platform: ARM64, msystem: CLANGARM64, msys: 'make diffutils mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-libwinpthread' }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-universal, os: macos-latest, architectures: 'arm64;x86_64' }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Every file a run produces is named blitzllvm-<version>-<platform>.<extension>.
      ARTIFACT: blitzllvm-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the submodules
        # Only the ones the build needs, and shallow. extra/ holds reference sources only, except for the two with the original samples and games, which are packaged.
        run: git submodule update --init --depth 1 --jobs 8 cmake/version cmake/externalcontent third_party/Vulkan-Headers third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/stb third_party/VulkanMemoryAllocator third_party/FFmpeg extra/blitz3d extra/blitzplus_msvc2017
      - name: Hash the dependency submodules
        id: dependencies
        shell: bash
        # The recorded commits of third_party/, so that updating a submodule changes the cache key.
        run: echo "hash=$(git ls-tree HEAD third_party/ | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install CMake
        # From PyPI, which is a few seconds on every runner. The project needs a newer CMake than the runners ship, and this
        # is always the latest one, as with the setup-cmake action it replaces, which downloaded and unpacked CMake each time.
        shell: bash
        run: pipx install cmake && cmake --version
      - name: Date the package cache
        id: month
        if: runner.os == 'Linux'
        # Ubuntu publishes updates to these packages, so the cache is replaced every month and never serves old ones for long.
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Install Linux dependencies for SDL
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # The packages and the files they installed are restored from the cache, so apt does not update, download and unpack
          # them on every run. The key is made from the list and the month.
          packages: ninja-build nasm libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl-dev rpm libarchive-tools zstd
          version: 1-${{ runner.arch }}-${{ steps.month.outputs.month }}
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm
      # dav1d (AVIF) has assembly for x86, which NASM builds.
      - name: Install Windows dependencies
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      # FFmpeg (movies) has a configure script, so on Windows it is built in MSYS2 (see code_runtime/dependencies.cmake).
      - name: Install MSYS2 for FFmpeg
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys }}
      - name: Tell the build where MSYS2 is
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BLITZLLVM_MSYS2=${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"
      # SDL3, SDL3_image (with its AVIF, JPEG XL and WebP codecs), SDL3_mixer and the Vulkan headers come from the submodules in third_party/ and are built by ExternalContent (see code_runtime/dependencies.cmake),
      # which skips every stage whose inputs are unchanged. Restoring its directory therefore skips their compilation entirely. Their
      # build options are defined in that file, so it is part of the key, and so are the ExternalContent module and the commits of the dependency submodules.
      # Pull requests restore the caches that nightly builds of root save, and only save one of their own when none exists yet.
      # The prefix is not shared with the caches from before the dependencies were submodules, as those were built from another source directory.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ExternalContentFiles
          key: submodule-dependencies-${{ matrix.name }}-${{ hashFiles('code_runtime/dependencies.cmake', 'cmake/externalcontent/ExternalContent.cmake') }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            submodule-dependencies-${{ matrix.name }}-
      - name: Configure
        shell: bash
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.platform }} -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON -DBLITZLLVM_REQUIRE_HELP=ON
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${ARCHITECTURES:+-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES"} -DBlitzLLVM_VERSION="$VERSION" -DBLITZLLVM_REQUIRE_NASM=ON -DBLITZLLVM_REQUIRE_HELP=ON
          fi
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist
          cp LICENSE.adoc README.adoc dist/
          # The libraries must not need the newer STL helpers (__std_rotate, ...), or programs fail to link with an older Visual Studio.
          [ "$RUNNER_OS" != Windows ] || .github/scripts/check-std-helpers.sh dist
          find dist -type f -exec ls -l {} + | sort -k5 -n -r
          # Zipped here, so the artifact is the .zip file itself and its name carries the extension.
          (cd dist && cmake -E tar cf "../${ARTIFACT}.zip" --format=zip .)
          cmake -E tar tf "${ARTIFACT}.zip" | .github/scripts/check-licenses.sh "${ARTIFACT}.zip" build/required-licenses.txt
          cmake -E tar tf "${ARTIFACT}.zip" | .github/scripts/check-help.sh "${ARTIFACT}.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARTIFACT }}.zip
          archive: false
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo gem install --no-document fpm
      - name: Build packages (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir packages
          # deb and rpm
          for generator in DEB RPM; do
            (cd build && cpack -G $generator -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          done
          # Arch Linux
          DESTDIR="$PWD/stage" cmake --install build --config Release --component system --prefix /usr
          fpm -s dir -t pacman -n blitzllvm -v "$VERSION" --description "BlitzBasic compiler built on LLVM" \
            --url https://github.com/Xaymar/BlitzLLVM --license BSD-3-Clause --depends clang --depends vulkan-icd-loader \
            -p "packages/${ARTIFACT}.pkg.tar.zst" -C stage usr
          rm -rf packages/_CPack_Packages
          mv packages/*.deb "packages/${ARTIFACT}.deb"
          mv packages/*.rpm "packages/${ARTIFACT}.rpm"
          # Every package has to list the licenses
          dpkg-deb --contents "packages/${ARTIFACT}.deb" | awk '{print $NF}' | .github/scripts/check-licenses.sh "${ARTIFACT}.deb" build/required-licenses.txt
          dpkg-deb --contents "packages/${ARTIFACT}.deb" | awk '{print $NF}' | .github/scripts/check-help.sh "${ARTIFACT}.deb"
          rpm -qlp "packages/${ARTIFACT}.rpm" | .github/scripts/check-licenses.sh "${ARTIFACT}.rpm" build/required-licenses.txt
          rpm -qlp "packages/${ARTIFACT}.rpm" | .github/scripts/check-help.sh "${ARTIFACT}.rpm"
          bsdtar -tf "packages/${ARTIFACT}.pkg.tar.zst" | .github/scripts/check-licenses.sh "${ARTIFACT}.pkg.tar.zst" build/required-licenses.txt
          bsdtar -tf "packages/${ARTIFACT}.pkg.tar.zst" | .github/scripts/check-help.sh "${ARTIFACT}.pkg.tar.zst"
          ls -l packages
      - name: Build packages (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir packages
          (cd build && cpack -G productbuild -C Release -D CPACK_COMPONENTS_ALL=system -B "$PWD/../packages")
          rm -rf packages/_CPack_Packages
          mv packages/*.pkg "packages/${ARTIFACT}.pkg"
          pkgutil --payload-files "packages/${ARTIFACT}.pkg" | .github/scripts/check-licenses.sh "${ARTIFACT}.pkg"
          pkgutil --payload-files "packages/${ARTIFACT}.pkg" | .github/scripts/check-help.sh "${ARTIFACT}.pkg"
          ls -l packages
      # Every package is uploaded on its own with 'archive: false', so it is a separate entry that is not zipped. The artifact is
      # named after the file.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: packages/${{ env.ARTIFACT }}.deb
          archive: false
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: packages/${{ env.ARTIFACT }}.rpm
          archive: false
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg.tar.zst
          archive: false
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          path: packages/${{ env.ARTIFACT }}.pkg
          archive: false

  # Hands the pull request number to pull-request-comment.yml, which runs outside of the pull request's context.
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Record the pull request
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$NUMBER" > pull-request-number
      - uses: actions/upload-artifact@v4
        with:
          name: pull-request-info
          path: pull-request-number
