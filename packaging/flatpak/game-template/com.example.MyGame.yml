# Template: release a game compiled with BlitzLLVM as a Flatpak. Copy this folder, rename com.example.MyGame everywhere (the file names,
# app-id, the desktop file and the metainfo) to an id you own (reverse domain, io.github.<you>.<Game> works), then run build.sh.
#
# The game runs on org.freedesktop.Platform, the runtime that the BlitzLLVM Flatpak (io.github.xaymar.BlitzLLVM) is based on, so a game
# compiled with it links against exactly the libraries that the Platform has. No compiler is shipped to the players.
app-id: com.example.MyGame
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: mygame

add-extensions:
  io.github.xaymar.BlitzLLVM.Runtime:
    # FFmpeg, the image codecs and Opus, shared by every game made with BlitzLLVM: Flatpak installs them once, so the game itself is only its
    # executable and its media. Installed together with the game (autodownload), and found through add-ld-path.
    directory: lib/blitzllvm-shared
    version: '25.08'
    add-ld-path: .

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # GPU (Vulkan) and controllers.
  - --device=all
  # Only for games with multiplayer (TCP/UDP, IPv6 included); remove it for single player games.
  - --share=network
  # The game does not get the player's files. Use $XDG_DATA_HOME (the launcher sets the working directory to it, see launcher.sh).

modules:
  - name: game
    buildsystem: simple
    build-commands:
      # game/ holds the executable (and libblitzphysics.so, which blitzcc copies next to it when the game uses collisions or picking), plus the
      # media files the game opens. The other libraries (movies, images, sound) are not copied: the Flatpak compiler knows that the extension has them.
      - mkdir -p /app/game /app/lib/blitzllvm-shared
      - cp -a game/. /app/game/
      - install -Dm755 launcher.sh /app/bin/mygame
      - install -Dm644 com.example.MyGame.desktop -t /app/share/applications
      - install -Dm644 com.example.MyGame.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.example.MyGame.png
      # The licenses of the libraries are shipped by the extension; add the ones of your own media and libraries to /app/share/licenses.
    sources:
      - type: dir
        path: .
